<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بيان — مدرّب الخطابة الذكي</title>
<style>
  :root {
    --ink-950: #0e1117;
    --ink-900: #141821;
    --ink-850: #1a1f2a;
    --ink-800: #212734;
    --ink-700: #2c3342;
    --line:    #333c4d;
    --gold:    #d9a441;
    --gold-2:  #ecc06a;
    --teal:    #46b3a2;
    --rose:    #e0705c;
    --fg:      #eef1f6;
    --fg-2:    #b6bece;
    --fg-3:    #7d8798;
    --r-l: 18px;
    --r-m: 13px;
    --r-s: 9px;
    --f: "Segoe UI", Tahoma, "Dubai", "Noto Naskh Arabic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink-950);
    background-image:
      radial-gradient(ellipse 50% 38% at 72% -6%, rgba(217,164,65,.10), transparent 68%),
      radial-gradient(ellipse 40% 30% at 8% 104%, rgba(70,179,162,.06), transparent 70%);
    color: var(--fg);
    font-family: var(--f);
    display: grid;
    grid-template-columns: 1fr 268px;
    height: 100vh;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- sidebar ---------- */
  aside {
    background: var(--ink-900);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 20px; padding: 20px 16px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; flex: none;
    background: linear-gradient(145deg, var(--gold-2), var(--gold) 70%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(217,164,65,.28);
  }
  .logo svg { width: 20px; height: 20px; }
  .bn { font-size: 19px; font-weight: 800; letter-spacing: -.2px; }
  .bs { font-size: 10.5px; color: var(--fg-3); margin-top: 1px; }

  .lbl { font-size: 10px; color: var(--fg-3); letter-spacing: 1.2px; margin-bottom: 8px; padding-inline: 2px; }
  .fields { display: flex; flex-direction: column; gap: 9px; }
  .fld { display: flex; flex-direction: column; gap: 5px; }
  .fld span { font-size: 11px; color: var(--fg-3); }
  .fld input, .fld select {
    background: var(--ink-800); border: 1px solid var(--line); color: var(--fg);
    border-radius: var(--r-s); padding: 9px 11px; font-size: 13px; font-family: var(--f); width: 100%;
  }
  .fld input:focus, .fld select:focus { outline: none; border-color: var(--gold); }
  .fld input::placeholder { color: var(--fg-3); }

  .note {
    margin-top: auto; padding: 12px; border-radius: var(--r-m);
    background: var(--ink-850); border: 1px solid var(--line);
    font-size: 11px; color: var(--fg-3); line-height: 1.8;
  }
  .note b { color: var(--fg-2); }

  /* ---------- main ---------- */
  main { display: flex; flex-direction: column; min-width: 0; padding: 18px 26px 18px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
  .top h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.2px; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--fg-3); }
  .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); box-shadow: 0 0 0 3px rgba(70,179,162,.16); }
  .ghost {
    all: unset; cursor: pointer; font-size: 11.5px; color: var(--fg-3);
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  }
  .ghost:hover { color: var(--fg); border-color: var(--gold); }
  .ghost:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 6px 2px 16px; }
  .m { display: flex; gap: 10px; max-width: 78%; }
  .m.bot { align-self: flex-start; }
  .m.me { align-self: flex-end; flex-direction: row-reverse; }
  .m.wide { max-width: 100%; align-self: stretch; }
  .av { width: 28px; height: 28px; border-radius: 9px; flex: none; display: flex; align-items: center; justify-content: center; }
  .m.bot .av { background: linear-gradient(145deg, var(--gold-2), var(--gold)); color: var(--ink-950); }
  .m.me .av { background: var(--ink-800); color: var(--teal); border: 1px solid var(--line); }
  .av svg { width: 15px; height: 15px; }
  .bub {
    padding: 11px 14px; border-radius: var(--r-m); font-size: 14.5px; line-height: 1.85;
    white-space: pre-wrap; word-break: break-word; min-width: 0;
  }
  .m.bot .bub { background: var(--ink-850); border: 1px solid var(--line); border-top-right-radius: 4px; }
  .m.me .bub { background: rgba(217,164,65,.13); border: 1px solid rgba(217,164,65,.28); border-top-left-radius: 4px; }
  .bub.bad { background: rgba(224,112,92,.12); border-color: rgba(224,112,92,.34); }

  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-3); animation: bl 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .18s; }
  .dots i:nth-child(3) { animation-delay: .36s; }
  @keyframes bl { 0%,80%,100% { opacity: .25 } 40% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { .dots i, .rd.on { animation: none } }

  /* ---------- report ---------- */
  .rep { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 11px; }
  .hero {
    display: flex; align-items: center; gap: 22px; flex-wrap: wrap;
    background: linear-gradient(135deg, var(--ink-800), var(--ink-850) 60%);
    border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px 22px;
  }
  .ring { position: relative; width: 104px; height: 104px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 0;
  }
  .ring .n { font-size: 30px; font-weight: 800; line-height: 1; }
  .ring .d { font-size: 10px; color: var(--fg-3); margin-top: 3px; }
  .hmeta { display: flex; flex-direction: column; gap: 9px; flex: 1; min-width: 180px; }
  .hl { font-size: 15px; line-height: 1.6; font-weight: 600; }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip { font-size: 11.5px; padding: 5px 11px; border-radius: 999px; background: var(--ink-900); border: 1px solid var(--line); color: var(--fg-2); }
  .chip.g { color: var(--teal); border-color: rgba(70,179,162,.4) }
  .chip.w { color: var(--rose); border-color: rgba(224,112,92,.4) }

  .card { background: var(--ink-850); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px 18px; }
  .card h3 { margin: 0 0 13px; font-size: 11px; font-weight: 700; color: var(--fg-3); letter-spacing: 1px; }
  .card .txt { font-size: 13.5px; line-height: 1.9; color: var(--fg-2); white-space: pre-wrap; }

  .bars { display: flex; flex-direction: column; gap: 11px; }
  .brow { display: grid; grid-template-columns: 110px 1fr 30px; align-items: center; gap: 12px; }
  .brow span:first-child { font-size: 12.5px; color: var(--fg-2); }
  .trk { height: 7px; background: var(--ink-800); border-radius: 999px; overflow: hidden; }
  .fil { height: 100%; background: var(--gold); border-radius: 999px; }
  .brow span:last-child { font-size: 12.5px; font-weight: 700; text-align: left; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px,1fr)); gap: 10px; }
  .tile { background: var(--ink-800); border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 13px; display: flex; flex-direction: column; gap: 4px; }
  .tile .k { font-size: 10.5px; color: var(--fg-3) }
  .tile .v { font-size: 20px; font-weight: 800; line-height: 1.15 }
  .tile .n { font-size: 10.5px; color: var(--fg-3); line-height: 1.55 }

  .fw { display: flex; flex-direction: column; gap: 8px; }
  .fwrow { display: flex; align-items: center; gap: 11px; }
  .fword {
    font-size: 14px; font-weight: 700; padding: 5px 13px; border-radius: 999px;
    background: rgba(224,112,92,.13); border: 1px solid rgba(224,112,92,.32); color: var(--rose);
    flex: none; min-width: 74px; text-align: center;
  }
  .fbar { flex: 1; height: 7px; background: var(--ink-800); border-radius: 999px; overflow: hidden; }
  .fbar i { display: block; height: 100%; background: var(--rose); border-radius: 999px; }
  .fcnt { font-size: 12.5px; color: var(--fg-2); flex: none; }
  .fsum { font-size: 12.5px; color: var(--fg-3); margin-top: 3px; line-height: 1.7; }

  /* ---------- composer ---------- */
  .comp { border-top: 1px solid var(--line); padding-top: 13px; display: flex; flex-direction: column; gap: 10px; }
  .acts { display: flex; gap: 9px; flex-wrap: wrap; }
  .act {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 20px; border-radius: var(--r-m); font-size: 14px; font-weight: 700;
    background: linear-gradient(145deg, var(--gold-2), var(--gold)); color: var(--ink-950);
    box-shadow: 0 6px 18px rgba(217,164,65,.22);
  }
  .act.alt { background: var(--ink-800); color: var(--fg); border: 1px solid var(--line); box-shadow: none; }
  .act:hover { filter: brightness(1.06) }
  .act.alt:hover { border-color: var(--gold); filter: none }
  .act:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
  .act:disabled { opacity: .42; cursor: not-allowed; filter: none }
  .act svg { width: 18px; height: 18px }

  .bar { display: flex; gap: 9px; align-items: flex-end; }
  .bar textarea {
    flex: 1; resize: none; min-height: 46px; max-height: 132px;
    background: var(--ink-850); border: 1px solid var(--line); color: var(--fg);
    border-radius: var(--r-m); padding: 13px 14px; font-size: 14.5px; font-family: var(--f); line-height: 1.6;
  }
  .bar textarea:focus { outline: none; border-color: var(--gold) }
  .bar textarea::placeholder { color: var(--fg-3) }
  .send {
    all: unset; cursor: pointer; width: 46px; height: 46px; flex: none;
    display: flex; align-items: center; justify-content: center; border-radius: var(--r-m);
    background: linear-gradient(145deg, var(--gold-2), var(--gold)); color: var(--ink-950);
  }
  .send:hover { filter: brightness(1.06) }
  .send:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px }
  .send:disabled { opacity: .42; cursor: not-allowed }
  .send svg { width: 19px; height: 19px }

  .panel { background: var(--ink-850); border: 1px solid var(--line); border-radius: var(--r-l); padding: 15px; display: flex; flex-direction: column; gap: 11px; }
  .cam { width: 100%; max-width: 300px; align-self: center; border-radius: var(--r-m); background: #000; display: none }
  .cam.on { display: block }
  .rst { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12.5px; color: var(--fg-2); text-align: center; line-height: 1.7 }
  .rd { width: 9px; height: 9px; border-radius: 50%; background: var(--rose); flex: none }
  .rd.on { animation: pl 1s infinite }
  @keyframes pl { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .rowc { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap }
  .btn { all: unset; cursor: pointer; padding: 9px 17px; border-radius: 999px; background: var(--ink-800); border: 1px solid var(--line); font-size: 13px }
  .btn:hover { border-color: var(--gold) }
  .btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px }
  .btn.pri { background: var(--gold); color: var(--ink-950); border-color: var(--gold); font-weight: 700 }
  .prev { width: 100%; max-width: 300px; align-self: center; border-radius: var(--r-m) }

  ::-webkit-scrollbar { width: 9px }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 9px }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr }
    aside { flex-direction: row; align-items: center; gap: 10px; border-left: none; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 11px 13px }
    .lbl, .note, .bs { display: none }
    .fields { flex-direction: row; gap: 8px }
    .fld span { display: none }
    .fld input, .fld select { width: auto; min-width: 108px }
    main { padding: 13px }
    .m { max-width: 93% }
    .brow { grid-template-columns: 92px 1fr 28px }
  }
</style>
</head>
<body>

<main>
  <div class="top">
    <h1>بيان — مدرّب الخطابة</h1>
    <div style="display:flex;align-items:center;gap:11px">
      <span class="live"><span class="pip"></span> وكيل ذكي متصل</span>
      <button class="ghost" id="reset">محادثة جديدة</button>
    </div>
  </div>
  <div class="log" id="log"></div>
  <div class="comp">
    <div id="extra"></div>
    <div class="acts">
      <button class="act" id="mic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/></svg>
        سجّل خطابك بالكاميرا
      </button>
      <button class="act alt" id="up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        ارفع تسجيلاً جاهزاً
      </button>
    </div>
    <div class="bar">
      <textarea id="input" rows="1" placeholder="اكتب أي شيء… اسأل بيان عن الخطابة والإلقاء والثقة أمام الجمهور"></textarea>
      <button class="send" id="send" title="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 3 11l7 3 3 7 7-17Z"/></svg>
      </button>
    </div>
  </div>
</main>

<aside>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0e1117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/>
      </svg>
    </div>
    <div>
      <div class="bn">بيان</div>
      <div class="bs">تقييم الخطابة بالذكاء الاصطناعي</div>
    </div>
  </div>

  <div>
    <div class="lbl">بياناتك للتحليل</div>
    <div class="fields">
      <label class="fld"><span>الاسم</span><input id="nm" type="text" placeholder="اسمك" /></label>
      <label class="fld"><span>نوع الخطاب</span>
        <select id="tp"><option>مفتوح</option><option>ارتجالي</option><option>معد</option></select>
      </label>
      <label class="fld"><span>الموضوع (اختياري)</span><input id="sb" type="text" placeholder="موضوع الخطاب" /></label>
    </div>
  </div>

  <div class="note">
    <b>كيف يعمل:</b> اضغط زر التسجيل أو الرفع، ويحلّل بيان خطابك ويعطيك درجات ومقاييس وكلمات الحشو التي كررتها وخطة تدريب أسبوعية.<br><br>
    <b>خصوصية:</b> التسجيل لا يُحفظ في أي مكان — يُخزَّن التقرير فقط لقياس تطوّرك.
  </div>
</aside>

<script>
(function () {
  "use strict";

  var log = document.getElementById("log");
  var extra = document.getElementById("extra");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var micBtn = document.getElementById("mic");
  var upBtn = document.getElementById("up");
  var resetBtn = document.getElementById("reset");
  var nm = document.getElementById("nm"), tp = document.getElementById("tp"), sb = document.getElementById("sb");

  var sid = "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  var busy = false;
  var rec = { stream: null, vr: null, ar: null, vc: [], ac: [], blob: null, audio: null, kind: null, timer: null, secs: 0 };

  try { var sn = localStorage.getItem("bayan_name"); if (sn) nm.value = sn; } catch (e) {}
  nm.addEventListener("change", function () { try { localStorage.setItem("bayan_name", nm.value.trim()); } catch (e) {} });

  var BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/></svg>';
  var ME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; }
  function down() { log.scrollTop = log.scrollHeight; }
  function put(parent, tag, cls, text) { var e = el(tag, cls); if (text !== undefined) e.textContent = text; parent.appendChild(e); return e; }

  function bot(t, bad) {
    var m = el("div", "m bot"); m.appendChild(el("div", "av", BOT));
    var b = el("div", "bub" + (bad ? " bad" : "")); b.textContent = t; m.appendChild(b);
    log.appendChild(m); down(); return b;
  }
  function me(t) {
    var m = el("div", "m me"); m.appendChild(el("div", "av", ME));
    var b = el("div", "bub"); b.textContent = t; m.appendChild(b);
    log.appendChild(m); down();
  }
  function typing() {
    var m = el("div", "m bot"); m.appendChild(el("div", "av", BOT));
    m.appendChild(el("div", "bub", '<span class="dots"><i></i><i></i><i></i></span>'));
    log.appendChild(m); down(); return m;
  }
  function setBusy(v) { busy = v; sendBtn.disabled = v; micBtn.disabled = v; upBtn.disabled = v; }

  /* ================= chat ================= */

  function ask(text) {
    if (busy) return;
    me(text); input.value = ""; input.style.height = "auto";
    setBusy(true);
    var t = typing();
    fetch("/api/chat", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ chatInput: text, sessionId: sid })
    })
      .then(function (r) { return r.text(); })
      .then(function (raw) {
        var j = null; try { j = JSON.parse(raw); } catch (e) {}
        t.remove();
        if (j && j.proxyError) throw new Error(j.proxyError);
        bot((j && (j.output || j.text)) || (raw || "").trim() || "لم يصل رد.");
      })
      .catch(function (e) { t.remove(); bot("تعذّر الوصول لبيان: " + e.message, true); })
      .then(function () { setBusy(false); input.focus(); });
  }

  sendBtn.addEventListener("click", function () { var v = input.value.trim(); if (v) ask(v); });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); var v = input.value.trim(); if (v) ask(v); }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto"; input.style.height = Math.min(132, input.scrollHeight) + "px";
  });
  resetBtn.addEventListener("click", function () {
    sid = "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    log.innerHTML = ""; extra.innerHTML = ""; greet();
  });
  function greet() {
    bot("أهلاً بك، أنا بيان — مدرّب الخطابة.\n\nاسألني عن أي شيء في الإلقاء والتقديم والثقة أمام الجمهور، وأجاوبك مباشرة.\n\nولما تجهز، اضغط «سجّل خطابك بالكاميرا» أو «ارفع تسجيلاً جاهزاً» وأعطيك تقريراً بدرجاتك وكلمات الحشو التي كررتها وخطة تدريب.");
  }

  /* ================= report ================= */

  var DIMS = [["الوضوح","وضوح الرسالة"],["البنية","تماسك البنية"],["الجذب","جذب الجمهور"],["اللغة","سلامة اللغة"],["الإيقاع","الإيقاع الصوتي"],["الثقة","الثقة والحضور"]];

  function parseRep(text) {
    var o = { sc: {}, overall: null, delta: null, head: "", secs: [] };
    DIMS.forEach(function (d) { var m = text.match(new RegExp(d[0] + "\\s+(\\d{1,3})")); if (m) o.sc[d[0]] = +m[1]; });
    var mo = text.match(/الإجمالي\s+(\d{1,3})/); if (mo) o.overall = +mo[1];
    var md = text.match(/الدرجة الإجمالية:\s*\d+\/100\s*\(([▲▼])\s*([+\-]?\d+)/);
    if (md) o.delta = { up: md[1] === "▲", v: Math.abs(+md[2]) };
    var body = text.replace(/^📊[^\n]*\n?/, "").trim();
    var i0 = body.indexOf("【");
    o.head = (i0 >= 0 ? body.slice(0, i0) : body).trim();
    if (i0 >= 0) {
      var rest = body.slice(i0), re = /【\s*([^】]+?)\s*】\s*\n?/g, mm, ps = [], last = null;
      while ((mm = re.exec(rest)) !== null) {
        if (last) last.e = mm.index;
        last = { t: mm[1].trim(), s: re.lastIndex, e: rest.length }; ps.push(last);
      }
      ps.forEach(function (p) { o.secs.push({ t: p.t, c: rest.slice(p.s, p.e).trim() }); });
    }
    return o;
  }

  function ringSvg(v) {
    var R = 44, C = 2 * Math.PI * R, off = C * (1 - Math.max(0, Math.min(100, v)) / 100);
    return '<svg width="104" height="104" viewBox="0 0 104 104">' +
      '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="#212734" stroke-width="9"/>' +
      '<circle cx="52" cy="52" r="' + R + '" fill="none" stroke="#d9a441" stroke-width="9" stroke-linecap="round" ' +
      'stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/></svg>';
  }
  function band(n) {
    if (n >= 80) return { c: "g", l: "متقدّم" };
    if (n >= 65) return { c: "", l: "جيد" };
    if (n >= 50) return { c: "", l: "يحتاج صقلاً" };
    return { c: "w", l: "يحتاج تدريباً مركزاً" };
  }

  // 【 كلمات الحشو والتلكؤ 】 → أعمدة لكل كلمة مع عدد مراتها
  function fillerCard(c) {
    var rows = [], re = /«\s*([^»]+?)\s*»\s*—\s*(\d+)\s*مرة/g, m;
    while ((m = re.exec(c)) !== null) rows.push({ w: m[1], n: +m[2] });
    var box = el("div", "fw");
    if (!rows.length) { put(box, "div", "fsum", c); return box; }
    var max = rows.reduce(function (a, r) { return Math.max(a, r.n); }, 1);
    rows.forEach(function (r) {
      var row = el("div", "fwrow");
      put(row, "span", "fword", r.w);
      var bar = el("div", "fbar"); var i = el("i");
      i.style.width = Math.max(6, (r.n / max) * 100) + "%";
      bar.appendChild(i); row.appendChild(bar);
      put(row, "span", "fcnt", r.n + " مرة");
      box.appendChild(row);
    });
    var tail = c.split("\n").filter(function (l) { return /^(المعدل|التقييم|قلتها)/.test(l.trim()); }).join("\n");
    if (tail) put(box, "div", "fsum", tail);
    return box;
  }

  function tilesCard(c) {
    var t = [];
    var w = c.match(/عدد الكلمات:\s*(\d+)/);
    var u = c.match(/كلمات فريدة:\s*(\d+)\s*\(ثراء\s*([\d.]+)%/);
    var p = c.match(/سرعة الكلام:\s*(\d+)\s*كلمة\/دقيقة\s*-\s*([^\n]+)/);
    var pn = c.match(/سرعة الكلام:\s*(غير متاحة)/);
    var s = c.match(/متوسط طول الجملة:\s*([\d.]+)\s*كلمة عبر\s*(\d+)/);
    if (w) t.push(["عدد الكلمات", w[1], ""]);
    if (u) t.push(["ثراء المفردات", u[2] + "%", u[1] + " كلمة فريدة"]);
    if (p) t.push(["سرعة الكلام", p[1], p[2].trim()]);
    else if (pn) t.push(["سرعة الكلام", "—", "المدة غير معروفة"]);
    if (s) t.push(["طول الجملة", s[1], "كلمة عبر " + s[2] + " جملة"]);
    if (!t.length) return null;
    var g = el("div", "tiles");
    t.forEach(function (x) {
      var d = el("div", "tile");
      put(d, "div", "k", x[0]); put(d, "div", "v", x[1]);
      if (x[2]) put(d, "div", "n", x[2]);
      g.appendChild(d);
    });
    return g;
  }

  function renderReport(text) {
    var r = parseRep(text);
    var m = el("div", "m bot wide"); m.appendChild(el("div", "av", BOT));
    var box = el("div", "rep"); m.appendChild(box);

    if (r.overall != null) {
      var hero = el("div", "hero");
      var ring = el("div", "ring", ringSvg(r.overall));
      var v = el("div", "val");
      put(v, "div", "n", String(r.overall));
      put(v, "div", "d", "من 100");
      ring.appendChild(v);
      hero.appendChild(ring);
      var hm = el("div", "hmeta");
      if (r.head) put(hm, "div", "hl", r.head);
      var ch = el("div", "chips");
      var b = band(r.overall);
      put(ch, "span", "chip " + b.c, b.l);
      put(ch, "span", "chip " + (r.delta ? (r.delta.up ? "g" : "w") : ""),
        r.delta ? ((r.delta.up ? "▲ +" : "▼ ") + r.delta.v + " عن الجلسة السابقة") : "جلستك الأولى — خط الأساس");
      hm.appendChild(ch); hero.appendChild(hm);
      box.appendChild(hero);
    }

    if (Object.keys(r.sc).length) {
      var c1 = el("div", "card"); put(c1, "h3", null, "الدرجات التفصيلية");
      var bars = el("div", "bars");
      DIMS.forEach(function (d) {
        var val = r.sc[d[0]]; if (val == null) return;
        var row = el("div", "brow");
        put(row, "span", null, d[1]);
        var trk = el("div", "trk"); var fil = el("div", "fil");
        fil.style.width = Math.max(2, Math.min(100, val)) + "%";
        trk.appendChild(fil); row.appendChild(trk);
        put(row, "span", null, String(val));
        bars.appendChild(row);
      });
      c1.appendChild(bars); box.appendChild(c1);
    }

    r.secs.forEach(function (s) {
      if (s.t.indexOf("الدرجات") === 0) return;
      var card = el("div", "card");
      put(card, "h3", null, s.t);
      if (s.t.indexOf("كلمات الحشو") === 0) { card.appendChild(fillerCard(s.c)); box.appendChild(card); return; }
      if (s.t.indexOf("مقاييس") === 0) {
        var g = tilesCard(s.c);
        if (g) { card.appendChild(g); box.appendChild(card); return; }
      }
      put(card, "div", "txt", s.c);
      box.appendChild(card);
    });

    if (!r.secs.length && r.overall == null) {
      var pc = el("div", "card"); put(pc, "div", "txt", text); box.appendChild(pc);
    }
    log.appendChild(m); down();
  }

  /* ================= size guard =================
     التحليل يذهب من المتصفح إلى المحرك مباشرة (CORS مفعّل)، فلا ينطبق عليه
     سقف دوال Vercel لا في الحجم ولا في الزمن. نضغط فقط الملفات الكبيرة جداً. */

  var ANALYZE_URL = "https://cop202.app.n8n.cloud/webhook/bayan-analyze";
  var MAX_BYTES = 8 * 1024 * 1024, HZ = 16000, MAX_SEC = 300;

  function wav(samples, rate) {
    var len = samples.length, buf = new ArrayBuffer(44 + len * 2), v = new DataView(buf);
    function s(o, t) { for (var i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); }
    s(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); s(8, "WAVE"); s(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); s(36, "data"); v.setUint32(40, len * 2, true);
    var o = 44;
    for (var i = 0; i < len; i++) { var x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2; }
    return new Blob([buf], { type: "audio/wav" });
  }

  function shrink(file) {
    var AC = window.AudioContext || window.webkitAudioContext;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC || !OAC) return Promise.reject(new Error("متصفحك لا يدعم معالجة الصوت."));
    return file.arrayBuffer().then(function (ab) {
      var ctx = new AC();
      return ctx.decodeAudioData(ab).then(function (d) { try { ctx.close(); } catch (e) {} return d; },
        function () { try { ctx.close(); } catch (e) {} throw new Error("تعذّر قراءة الصوت من هذا الملف."); });
    }).then(function (dec) {
      var use = Math.min(dec.duration, MAX_SEC);
      var off = new OAC(1, Math.max(1, Math.ceil(use * HZ)), HZ);
      var src = off.createBufferSource(); src.buffer = dec; src.connect(off.destination); src.start(0);
      return off.startRendering().then(function (r) {
        return { blob: wav(r.getChannelData(0), HZ), dur: Math.round(dec.duration), trimmed: dec.duration > MAX_SEC };
      });
    });
  }

  function prep(file, secs) {
    if (file.size <= MAX_BYTES) return Promise.resolve({ file: file, secs: secs });
    var n = bot("جاري استخراج المسار الصوتي وضغطه…");
    return shrink(file).then(function (r) {
      var msg = "تم الضغط إلى " + (r.blob.size / 1048576).toFixed(2) + " ميجا.";
      if (r.trimmed) msg += " التسجيل طويل، فحُلّل أول " + Math.floor(MAX_SEC / 60) + ":" + (MAX_SEC % 60) + " منه.";
      n.textContent = msg;
      return { file: new File([r.blob], "speech.wav", { type: "audio/wav" }), secs: r.trimmed ? MAX_SEC : (secs || r.dur) };
    }).catch(function (e) { n.textContent = "تعذّر ضغط الملف: " + e.message; n.classList.add("bad"); throw e; });
  }

  /* ================= analysis ================= */

  function analyze(file, secs) {
    var name = nm.value.trim();
    if (!name) { askName(function (n) { nm.value = n; try { localStorage.setItem("bayan_name", n); } catch (e) {} run(file, secs, n); }); return; }
    run(file, secs, name);
  }

  function askName(next) {
    extra.innerHTML = "";
    bot("استلمت التسجيل. باقي شيء واحد — وش اسمك؟ (أحتاجه لأتابع تطوّرك بين الجلسات)");
    var p = el("div", "panel"), row = el("div", "bar");
    var i = el("input"); i.type = "text"; i.placeholder = "اكتب اسمك";
    i.style.cssText = "flex:1;background:var(--ink-800);border:1px solid var(--line);color:var(--fg);border-radius:var(--r-m);padding:13px 14px;font-size:14.5px;font-family:var(--f)";
    var ok = el("button", "act"); ok.textContent = "ابدأ التحليل";
    row.appendChild(i); row.appendChild(ok); p.appendChild(row); extra.appendChild(p); i.focus();
    function go() { var v = i.value.trim(); if (!v) { i.focus(); return; } extra.innerHTML = ""; me(v); next(v); }
    ok.addEventListener("click", go);
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
  }

  function run(file, secs, name) {
    setBusy(true);
    bot("جاري تفريغ خطابك وحساب المقاييس ثم التقييم — عادةً أقل من دقيقة.");
    var t = typing();

    var fd = new FormData();
    fd.append("name", name);
    fd.append("speechType", tp.value);
    fd.append("topic", sb.value.trim());
    fd.append("duration", secs ? String(secs) : "");
    fd.append("file", file, file.name || "speech.webm");

    // مباشرة إلى المحرك — بدون وسيط، فلا سقف زمني ولا سقف حجم
    fetch(ANALYZE_URL, { method: "POST", body: fd })
      .then(function (r) {
        if (!r.ok) throw new Error("المحرك رد بالرمز " + r.status + ". راجع سجل التنفيذ في n8n.");
        return r.text();
      })
      .then(function (raw) {
        var j = null; try { j = JSON.parse(raw); } catch (e) {}
        if (j && j.message && !j.full_report) throw new Error(j.message);
        var rep = (j && j.full_report) || (raw || "").trim();
        if (!rep) throw new Error("لم يصل تقرير من المحرك.");
        t.remove();
        renderReport(rep);
      })
      .catch(function (e) { t.remove(); bot("تعذّر إكمال التحليل: " + e.message, true); })
      .then(function () { setBusy(false); });
  }

  /* ================= upload ================= */

  var picker = document.createElement("input");
  picker.type = "file";
  picker.accept = ".mp3,.wav,.m4a,.aac,.ogg,.mp4,.mov,.webm,.m4v";
  picker.style.display = "none";
  document.body.appendChild(picker);
  upBtn.addEventListener("click", function () { if (!busy) picker.click(); });
  picker.addEventListener("change", function () {
    if (!picker.files || !picker.files[0]) return;
    var f = picker.files[0]; picker.value = "";
    me("⬆ " + f.name + " (" + (f.size / 1048576).toFixed(1) + " ميجا)");
    setBusy(true);
    dur(f).then(function (s) { return prep(f, s); })
      .then(function (r) { setBusy(false); analyze(r.file, r.secs); })
      .catch(function () { setBusy(false); });
  });
  function dur(file) {
    return new Promise(function (res) {
      var v = document.createElement(/^video\//.test(file.type) ? "video" : "audio");
      var u = URL.createObjectURL(file), done = false;
      function fin(x) { if (done) return; done = true; URL.revokeObjectURL(u); res(Number.isFinite(x) && x > 0 ? Math.round(x) : null); }
      v.preload = "metadata"; v.onloadedmetadata = function () { fin(v.duration); }; v.onerror = function () { fin(null); };
      setTimeout(function () { fin(null); }, 6000); v.src = u;
    });
  }

  /* ================= recording ================= */

  function stopTracks() { if (rec.stream) rec.stream.getTracks().forEach(function (t) { t.stop(); }); rec.stream = null; }
  function pickMime(k) {
    var L = k === "video" ? ["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"]
                          : ["audio/webm;codecs=opus","audio/webm","audio/mp4"];
    for (var i = 0; i < L.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(L[i])) return L[i];
    return "";
  }
  function clk(s) { var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x; }

  micBtn.addEventListener("click", function () {
    if (busy) return;
    extra.innerHTML = "";
    var p = el("div", "panel");
    p.appendChild(el("div", "rst", "<span>وش تفضّل تسجّل؟</span>"));
    var q = el("div", "rowc");
    var bv = el("button", "btn pri"); bv.textContent = "🎥 فيديو";
    var ba = el("button", "btn"); ba.textContent = "🎤 صوت فقط";
    var bx = el("button", "btn"); bx.textContent = "إلغاء";
    q.appendChild(bv); q.appendChild(ba); q.appendChild(bx); p.appendChild(q);
    extra.appendChild(p);
    bx.addEventListener("click", function () { extra.innerHTML = ""; });
    bv.addEventListener("click", function () { startRec("video"); });
    ba.addEventListener("click", function () { startRec("audio"); });
  });

  function startRec(kind) {
    extra.innerHTML = "";
    var p = el("div", "panel");
    var cam = el("video", "cam" + (kind === "video" ? " on" : ""));
    cam.autoplay = true; cam.muted = true; cam.playsInline = true;
    var st = el("div", "rst", '<span class="rd"></span><span>اضغط «ابدأ» وامنح إذن الكاميرا والمايك</span>');
    var row = el("div", "rowc");
    var go = el("button", "btn pri"); go.textContent = "ابدأ التسجيل";
    var bk = el("button", "btn"); bk.textContent = "رجوع";
    row.appendChild(go); row.appendChild(bk);
    p.appendChild(cam); p.appendChild(st); p.appendChild(row); extra.appendChild(p);
    bk.addEventListener("click", function () { stopTracks(); extra.innerHTML = ""; });

    go.addEventListener("click", function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        st.textContent = "متصفحك لا يدعم التسجيل المباشر — استخدم زر الرفع."; return;
      }
      navigator.mediaDevices.getUserMedia(kind === "video" ? { video: true, audio: true } : { audio: true })
        .then(function (s) {
          rec.stream = s; rec.kind = kind;
          if (kind === "video") cam.srcObject = s;
          var vm = pickMime(kind);
          rec.vr = vm ? new MediaRecorder(s, { mimeType: vm }) : new MediaRecorder(s);
          rec.vc = [];
          rec.vr.ondataavailable = function (e) { if (e.data && e.data.size) rec.vc.push(e.data); };

          // مسار صوتي منفصل خفيف — هو وحده ما يُرسل للتحليل
          rec.ar = null; rec.ac = [];
          var at = s.getAudioTracks();
          if (at.length) {
            try {
              var am = pickMime("audio");
              rec.ar = new MediaRecorder(new MediaStream(at), am ? { mimeType: am, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
              rec.ar.ondataavailable = function (e) { if (e.data && e.data.size) rec.ac.push(e.data); };
            } catch (e) { rec.ar = null; }
          }
          var left = rec.ar ? 2 : 1;
          function fin() { if (--left === 0) { stopTracks(); preview(kind); } }
          rec.vr.onstop = function () { rec.blob = new Blob(rec.vc, { type: vm || "video/webm" }); fin(); };
          if (rec.ar) { rec.ar.onstop = function () { rec.audio = new Blob(rec.ac, { type: rec.ar.mimeType || "audio/webm" }); fin(); }; rec.ar.start(); }
          rec.vr.start();

          rec.secs = 0;
          st.innerHTML = '<span class="rd on"></span><span id="tm">00:00 — جارٍ التسجيل</span>';
          rec.timer = setInterval(function () {
            rec.secs++; var e = document.getElementById("tm");
            if (e) e.textContent = clk(rec.secs) + " — جارٍ التسجيل";
          }, 1000);
          var sp = el("button", "btn pri"); sp.textContent = "إيقاف";
          row.replaceChild(sp, go);
          sp.addEventListener("click", function () {
            clearInterval(rec.timer);
            if (rec.ar && rec.ar.state !== "inactive") rec.ar.stop();
            if (rec.vr.state !== "inactive") rec.vr.stop();
          });
        })
        .catch(function (err) {
          st.textContent = "تعذّر الوصول للكاميرا أو المايك: " + err.message + " — تأكد من السماح بالإذن، أو استخدم زر الرفع.";
        });
    });
  }

  function preview(kind) {
    extra.innerHTML = "";
    var p = el("div", "panel");
    var pl = el(kind === "video" ? "video" : "audio", "prev");
    pl.controls = true; pl.src = URL.createObjectURL(rec.blob);
    p.appendChild(pl);
    var row = el("div", "rowc");
    var again = el("button", "btn"); again.textContent = "إعادة التسجيل";
    var use = el("button", "btn pri"); use.textContent = "حلّل هذا التسجيل";
    row.appendChild(again); row.appendChild(use); p.appendChild(row); extra.appendChild(p);

    again.addEventListener("click", function () { rec.blob = null; rec.audio = null; startRec(kind); });
    use.addEventListener("click", function () {
      var send = rec.audio && rec.audio.size ? rec.audio : rec.blob;
      var ext = (send.type || "").indexOf("mp4") !== -1 ? "mp4" : "webm";
      var f = new File([send], "speech." + ext, { type: send.type || "audio/webm" });
      me("🎬 تسجيل " + clk(rec.secs) + " · " + (f.size / 1048576).toFixed(2) + " ميجا");
      extra.innerHTML = "";
      if (f.size > MAX_BYTES) {
        setBusy(true);
        prep(f, rec.secs).then(function (r) { setBusy(false); analyze(r.file, r.secs); }).catch(function () { setBusy(false); });
      } else analyze(f, rec.secs);
    });
  }

  greet();
  input.focus();
})();
</script>
