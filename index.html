<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>خطيب — مدرّب الخطابة الذكي</title>
<style>
  :root {
    --bg: #14100a;
    --panel: #1b150e;
    --panel-2: #221b13;
    --raise: #2a2117;
    --line: #45392b;
    --accent: #e8a33d;
    --accent-2: #f0b75c;
    --good: #4fb6a8;
    --warn: #e0654f;
    --ink: #f5ecda;
    --ink-2: #cdbfa4;
    --ink-3: #9c8b70;
    --r: 14px;
    --font: "Segoe UI", Tahoma, "Dubai", "Noto Naskh Arabic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    background-image: radial-gradient(ellipse 55% 40% at 50% 0%, rgba(232,163,61,.08), transparent 70%);
    color: var(--ink);
    font-family: var(--font);
    display: grid;
    grid-template-columns: 1fr 260px;
    height: 100vh;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }

  aside {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 18px; padding: 18px 15px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(150deg, var(--accent-2), var(--accent) 65%);
    display: flex; align-items: center; justify-content: center;
  }
  .logo svg { width: 19px; height: 19px; }
  .bname { font-size: 16px; font-weight: 700; }
  .bsub { font-size: 10.5px; color: var(--ink-3); }

  .grp-t { font-size: 10.5px; color: var(--ink-3); letter-spacing: .8px; margin-bottom: 7px; padding-inline: 3px; }
  .who {
    background: var(--raise); border: 1px solid var(--line); border-radius: var(--r);
    padding: 11px 12px; display: flex; flex-direction: column; gap: 7px;
  }
  .who label { font-size: 11px; color: var(--ink-3); }
  .who input, .who select {
    background: var(--panel); border: 1px solid var(--line); color: var(--ink);
    border-radius: 9px; padding: 8px 10px; font-size: 12.5px; font-family: var(--font); width: 100%;
  }
  .who input:focus, .who select:focus { outline: none; border-color: var(--accent); }

  .tip {
    margin-top: auto; padding: 11px; border-radius: var(--r);
    background: var(--raise); border: 1px solid var(--line);
    font-size: 11px; color: var(--ink-3); line-height: 1.7;
  }
  .tip b { color: var(--ink-2); }

  main { display: flex; flex-direction: column; min-width: 0; padding: 16px 22px 16px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .top h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .top .st { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  .ghost {
    all: unset; cursor: pointer; font-size: 11.5px; color: var(--ink-3);
    padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line);
  }
  .ghost:hover { color: var(--ink); border-color: var(--accent); }
  .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 13px; padding: 6px 2px 14px; }
  .m { display: flex; gap: 9px; max-width: 80%; }
  .m.bot { align-self: flex-start; }
  .m.me { align-self: flex-end; flex-direction: row-reverse; }
  .m.full { max-width: 100%; align-self: stretch; }
  .av { width: 27px; height: 27px; border-radius: 8px; flex: none; display: flex; align-items: center; justify-content: center; }
  .m.bot .av { background: var(--accent); color: var(--bg); }
  .m.me .av { background: var(--raise); color: var(--good); border: 1px solid var(--line); }
  .av svg { width: 15px; height: 15px; }
  .bub {
    padding: 10px 13px; border-radius: var(--r); font-size: 14px; line-height: 1.8;
    white-space: pre-wrap; word-break: break-word; min-width: 0;
  }
  .m.bot .bub { background: var(--raise); border: 1px solid var(--line); border-top-right-radius: 4px; }
  .m.me .bub { background: rgba(232,163,61,.15); border: 1px solid rgba(232,163,61,.3); border-top-left-radius: 4px; }
  .bub.bad { background: rgba(224,101,79,.13); border-color: rgba(224,101,79,.34); }

  .dots { display: inline-flex; gap: 4px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); animation: bl 1.2s infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes bl { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots i, .rd.on { animation: none; } }

  /* report */
  .rep { flex: 1; min-width: 0; }
  .hero {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: linear-gradient(140deg, var(--raise), var(--panel-2));
    border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 11px;
  }
  .big { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .of { font-size: 14px; color: var(--ink-3); }
  .hmeta { display: flex; flex-direction: column; gap: 7px; flex: 1; min-width: 0; }
  .hline { font-size: 13.5px; line-height: 1.65; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--ink-2); }
  .chip.g { color: var(--good); border-color: rgba(79,182,168,.4); }
  .chip.w { color: var(--warn); border-color: rgba(224,101,79,.4); }

  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 11px; font-size: 11.5px; font-weight: 700; color: var(--ink-3); letter-spacing: .5px; }
  .card .txt { font-size: 13.5px; line-height: 1.85; color: var(--ink-2); white-space: pre-wrap; }
  .bars { display: flex; flex-direction: column; gap: 9px; }
  .brow { display: grid; grid-template-columns: 104px 1fr 32px; align-items: center; gap: 11px; }
  .blab { font-size: 12.5px; color: var(--ink-2); }
  .btrack { height: 8px; background: var(--raise); border-radius: 999px; overflow: hidden; }
  .bfill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bval { font-size: 12.5px; text-align: left; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 9px; }
  .tile { background: var(--raise); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 3px; }
  .tile .k { font-size: 10.5px; color: var(--ink-3); }
  .tile .v { font-size: 18px; font-weight: 700; }
  .tile .n { font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }

  /* composer */
  .comp { border-top: 1px solid var(--line); padding-top: 11px; display: flex; flex-direction: column; gap: 9px; }
  .acts { display: flex; gap: 9px; flex-wrap: wrap; }
  .act {
    all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 9px;
    padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 700;
    background: var(--accent); color: var(--bg); border: 1px solid var(--accent);
  }
  .act:hover { background: var(--accent-2); }
  .act:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .act.alt { background: var(--raise); color: var(--ink); border-color: var(--line); }
  .act.alt:hover { border-color: var(--accent); }
  .act:disabled { opacity: .45; cursor: not-allowed; }
  .act svg { width: 18px; height: 18px; }
  .bar { display: flex; gap: 8px; align-items: flex-end; }
  .bar textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 130px;
    background: var(--raise); border: 1px solid var(--line); color: var(--ink);
    border-radius: var(--r); padding: 12px 13px; font-size: 14px; font-family: var(--font); line-height: 1.6;
  }
  .bar textarea:focus { outline: none; border-color: var(--accent); }
  .ico {
    all: unset; cursor: pointer; width: 44px; height: 44px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; background: var(--raise); border: 1px solid var(--line); color: var(--ink-2);
  }
  .ico:hover { border-color: var(--accent); color: var(--ink); }
  .ico:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ico svg { width: 19px; height: 19px; }
  .ico.send { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .ico.send:hover { background: var(--accent-2); }
  .ico:disabled { opacity: .45; cursor: not-allowed; }

  .panel { background: var(--raise); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cam { width: 100%; max-width: 300px; align-self: center; border-radius: 12px; background: #000; display: none; }
  .cam.on { display: block; }
  .rstat { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12.5px; color: var(--ink-2); text-align: center; line-height: 1.6; }
  .rd { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
  .rd.on { animation: pl 1s infinite; }
  @keyframes pl { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .rowc { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .btn { all: unset; cursor: pointer; padding: 9px 17px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.pri { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .btn.pri:hover { background: var(--accent-2); }
  .prev { width: 100%; max-width: 300px; align-self: center; border-radius: 12px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    aside { flex-direction: row; align-items: center; gap: 12px; border-left: none; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 10px 12px; }
    .grp-t, .tip, .bsub { display: none; }
    .who { flex-direction: row; align-items: center; gap: 8px; }
    .who label { display: none; }
    .who input, .who select { width: auto; min-width: 110px; }
    main { padding: 12px; }
    .m { max-width: 93%; }
    .brow { grid-template-columns: 88px 1fr 30px; }
    .big { font-size: 38px; }
  }
</style>
</head>
<body>

<main>
  <div class="top">
    <h1>خطيب — مدرّب الخطابة</h1>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="st"><span class="dot"></span> متصل بـ GPT-4o</span>
      <button class="ghost" id="reset">محادثة جديدة</button>
    </div>
  </div>
  <div class="log" id="log"></div>
  <div class="comp" id="comp">
    <div id="extra"></div>
    <div class="acts">
      <button class="act" id="mic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/></svg>
        سجّل خطابك بالكاميرا
      </button>
      <button class="act alt" id="up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
        ارفع تسجيلاً جاهزاً
      </button>
    </div>
    <div class="bar">
      <textarea id="input" rows="1" placeholder="اكتب أي شيء… اسأل عن الخطابة، أو اطلب تحليل خطابك"></textarea>
      <button class="ico send" id="send" title="إرسال">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4 3 11l7 3 3 7 7-17Z"/></svg>
      </button>
    </div>
  </div>
</main>

<aside>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#14100a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/>
      </svg>
    </div>
    <div>
      <div class="bname">خطيب</div>
      <div class="bsub">تقييم الخطابة بالذكاء الاصطناعي</div>
    </div>
  </div>

  <div>
    <div class="grp-t">بياناتك للتحليل</div>
    <div class="who">
      <label for="nm">الاسم</label>
      <input id="nm" type="text" placeholder="اسمك" />
      <label for="tp">نوع الخطاب</label>
      <select id="tp">
        <option>مفتوح</option>
        <option>ارتجالي</option>
        <option>معد</option>
      </select>
      <label for="sb">الموضوع (اختياري)</label>
      <input id="sb" type="text" placeholder="موضوع الخطاب" />
    </div>
  </div>

  <div class="tip">
    <b>التحليل:</b> اضغط 🎤 للتسجيل المباشر أو ⬆ لرفع ملف. يرجع لك تقرير بدرجات ومقاييس وخطة تدريب.<br><br>
    <b>خصوصية:</b> التسجيل لا يُحفظ في أي مكان — يُخزَّن التقرير فقط.
  </div>
</aside>

<script>
(function () {
  "use strict";

  var log = document.getElementById("log");
  var extra = document.getElementById("extra");
  var input = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var micBtn = document.getElementById("mic");
  var upBtn = document.getElementById("up");
  var resetBtn = document.getElementById("reset");
  var nm = document.getElementById("nm");
  var tp = document.getElementById("tp");
  var sb = document.getElementById("sb");

  var sessionId = "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  var busy = false;
  var rec = { stream: null, recorder: null, chunks: [], blob: null, kind: null, timer: null, secs: 0 };

  try {
    var savedName = localStorage.getItem("khatib_name");
    if (savedName) nm.value = savedName;
  } catch (e) {}
  nm.addEventListener("change", function () {
    try { localStorage.setItem("khatib_name", nm.value.trim()); } catch (e) {}
  });

  var BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/></svg>';
  var ME = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';

  function el(t, c, h) { var e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; }
  function down() { log.scrollTop = log.scrollHeight; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function bot(text, bad) {
    var m = el("div", "m bot");
    m.appendChild(el("div", "av", BOT));
    var b = el("div", "bub" + (bad ? " bad" : ""));
    b.textContent = text;
    m.appendChild(b);
    log.appendChild(m); down();
    return b;
  }
  function me(text) {
    var m = el("div", "m me");
    m.appendChild(el("div", "av", ME));
    var b = el("div", "bub");
    b.textContent = text;
    m.appendChild(b);
    log.appendChild(m); down();
  }
  function typing() {
    var m = el("div", "m bot");
    m.appendChild(el("div", "av", BOT));
    m.appendChild(el("div", "bub", '<span class="dots"><i></i><i></i><i></i></span>'));
    log.appendChild(m); down();
    return m;
  }
  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v; micBtn.disabled = v; upBtn.disabled = v;
  }

  /* ---------- chat with the real agent ---------- */

  function ask(text) {
    if (busy) return;
    me(text);
    input.value = "";
    input.style.height = "auto";
    setBusy(true);
    var t = typing();

    fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ chatInput: text, sessionId: sessionId })
    })
      .then(function (r) { return r.text(); })
      .then(function (raw) {
        var j = null;
        try { j = JSON.parse(raw); } catch (e) {}
        t.remove();
        if (j && j.proxyError) throw new Error(j.proxyError);
        var reply = (j && (j.output || j.text || j.message)) || (raw || "").trim();
        bot(reply || "لم يصل رد. حاول مرة أخرى.");
      })
      .catch(function (e) { t.remove(); bot("تعذّر الوصول للوكيل: " + e.message, true); })
      .then(function () { setBusy(false); input.focus(); });
  }

  sendBtn.addEventListener("click", function () {
    var v = input.value.trim();
    if (v) ask(v);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      var v = input.value.trim();
      if (v) ask(v);
    }
  });
  input.addEventListener("input", function () {
    input.style.height = "auto";
    input.style.height = Math.min(130, input.scrollHeight) + "px";
  });

  resetBtn.addEventListener("click", function () {
    sessionId = "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
    log.innerHTML = "";
    extra.innerHTML = "";
    greet();
  });

  function greet() {
    bot("أهلاً بك. أنا خطيب — مدرّب الخطابة. اسألني عن أي شيء في الإلقاء والتقديم والثقة أمام الجمهور.\n\nولما تجهز، اضغط زر «سجّل خطابك بالكاميرا» أو «ارفع تسجيلاً جاهزاً» تحت، وأعطيك تقريراً بدرجات ومقاييس دقيقة.");
  }

  /* ---------- report rendering ---------- */

  var DIMS = [
    ["الوضوح", "وضوح الرسالة"], ["البنية", "تماسك البنية"], ["الجذب", "جذب الجمهور"],
    ["اللغة", "سلامة اللغة"], ["الإيقاع", "الإيقاع الصوتي"], ["الثقة", "الثقة والحضور"]
  ];

  function parseReport(text) {
    var out = { sc: {}, overall: null, delta: null, head: "", secs: [] };
    DIMS.forEach(function (d) {
      var m = text.match(new RegExp(d[0] + "\\s+(\\d{1,3})"));
      if (m) out.sc[d[0]] = Number(m[1]);
    });
    var mo = text.match(/الإجمالي\s+(\d{1,3})/);
    if (mo) out.overall = Number(mo[1]);
    var md = text.match(/الدرجة الإجمالية:\s*\d+\/100\s*\(([▲▼])\s*([+\-]?\d+)/);
    if (md) out.delta = { up: md[1] === "▲", v: Math.abs(Number(md[2])) };

    var body = text.replace(/^📊[^\n]*\n?/, "").trim();
    var i0 = body.indexOf("【");
    out.head = (i0 >= 0 ? body.slice(0, i0) : body).trim();
    if (i0 >= 0) {
      var rest = body.slice(i0);
      var re = /【\s*([^】]+?)\s*】\s*\n?/g, mm, parts = [], last = null;
      while ((mm = re.exec(rest)) !== null) {
        if (last) last.e = mm.index;
        last = { t: mm[1].trim(), s: re.lastIndex, e: rest.length };
        parts.push(last);
      }
      parts.forEach(function (p) { out.secs.push({ t: p.t, c: rest.slice(p.s, p.e).trim() }); });
    }
    return out;
  }

  function band(n) {
    if (n >= 80) return { c: "g", l: "متقدّم" };
    if (n >= 65) return { c: "", l: "جيد" };
    if (n >= 50) return { c: "", l: "يحتاج صقلاً" };
    return { c: "w", l: "يحتاج تدريباً مركزاً" };
  }

  function tilesFrom(c) {
    var t = [];
    var w = c.match(/عدد الكلمات:\s*(\d+)/);
    var u = c.match(/كلمات فريدة:\s*(\d+)\s*\(ثراء\s*([\d.]+)%/);
    var p = c.match(/سرعة الكلام:\s*(\d+)\s*كلمة\/دقيقة\s*-\s*([^\n]+)/);
    var pn = c.match(/سرعة الكلام:\s*(غير متاحة)/);
    var f = c.match(/التلكؤات:\s*(\d+)\s*مرة\s*\(([\d.]+)\s*لكل 100 كلمة\)\s*-\s*([^\n]+)/);
    if (w) t.push(["عدد الكلمات", w[1], ""]);
    if (u) t.push(["ثراء المفردات", u[2] + "%", u[1] + " كلمة فريدة"]);
    if (p) t.push(["سرعة الكلام", p[1], p[2].trim()]);
    else if (pn) t.push(["سرعة الكلام", "—", "المدة غير معروفة"]);
    if (f) t.push(["التلكؤات", f[1], f[2] + " لكل 100 كلمة · " + f[3].trim()]);
    if (!t.length) return null;
    var wrap = el("div", "tiles");
    t.forEach(function (x) {
      var d = el("div", "tile");
      d.appendChild(el("div", "k")).textContent = x[0];
      d.appendChild(el("div", "v")).textContent = x[1];
      if (x[2]) d.appendChild(el("div", "n")).textContent = x[2];
      wrap.appendChild(d);
    });
    return wrap;
  }

  function renderReport(text) {
    var r = parseReport(text);
    var m = el("div", "m bot full");
    m.appendChild(el("div", "av", BOT));
    var box = el("div", "rep");
    m.appendChild(box);

    if (r.overall != null) {
      var hero = el("div", "hero");
      var sc = el("div"); sc.style.display = "flex"; sc.style.alignItems = "baseline"; sc.style.gap = "5px";
      sc.appendChild(el("div", "big")).textContent = String(r.overall);
      sc.appendChild(el("div", "of")).textContent = "/100";
      hero.appendChild(sc);
      var hm = el("div", "hmeta");
      if (r.head) hm.appendChild(el("div", "hline")).textContent = r.head;
      var ch = el("div", "chips");
      var b = band(r.overall);
      ch.appendChild(el("span", "chip " + b.c)).textContent = b.l;
      var c2 = el("span", "chip " + (r.delta ? (r.delta.up ? "g" : "w") : ""));
      c2.textContent = r.delta ? ((r.delta.up ? "▲ +" : "▼ ") + r.delta.v + " عن الجلسة السابقة") : "جلستك الأولى — خط الأساس";
      ch.appendChild(c2);
      hm.appendChild(ch);
      hero.appendChild(hm);
      box.appendChild(hero);
    }

    if (Object.keys(r.sc).length) {
      var card = el("div", "card");
      card.appendChild(el("h3")).textContent = "الدرجات التفصيلية";
      var bars = el("div", "bars");
      DIMS.forEach(function (d) {
        var v = r.sc[d[0]];
        if (v == null) return;
        var row = el("div", "brow");
        row.appendChild(el("div", "blab")).textContent = d[1];
        var tr = el("div", "btrack");
        var fl = el("div", "bfill");
        fl.style.width = Math.max(2, Math.min(100, v)) + "%";
        tr.appendChild(fl); row.appendChild(tr);
        row.appendChild(el("div", "bval")).textContent = String(v);
        bars.appendChild(row);
      });
      card.appendChild(bars);
      box.appendChild(card);
    }

    r.secs.forEach(function (s) {
      if (s.t.indexOf("الدرجات") === 0) return;
      var card = el("div", "card");
      card.appendChild(el("h3")).textContent = s.t;
      if (s.t.indexOf("مقاييس") === 0) {
        var tl = tilesFrom(s.c);
        if (tl) { card.appendChild(tl); box.appendChild(card); return; }
      }
      card.appendChild(el("div", "txt")).textContent = s.c;
      box.appendChild(card);
    });

    if (!r.secs.length && r.overall == null) {
      var pc = el("div", "card");
      pc.appendChild(el("div", "txt")).textContent = text;
      box.appendChild(pc);
    }

    log.appendChild(m); down();
  }

  /* ---------- analysis pipeline ---------- */

  function via(u) { return "/api/status?url=" + encodeURIComponent(u); }

  function readResult(u) {
    return fetch(via(u)).then(function (r) { return r.text(); }).then(function (html) {
      var d = new DOMParser().parseFromString(html, "text/html");
      var b = d.querySelector("#submitted-content") || d.querySelector(".header p") || d.querySelector(".card p");
      return b ? b.textContent.trim() : "اكتمل التنفيذ بدون محتوى.";
    });
  }

  function poll(wurl) {
    var w = new URL(wurl);
    var sig = w.searchParams.get("signature");
    var st = new URL(w.href);
    st.pathname = st.pathname.replace(/\/$/, "") + "/n8n-execution-status";
    if (sig) st.searchParams.set("signature", sig);
    var wait = 2000, end = Date.now() + 6 * 60 * 1000;
    function tick() {
      if (Date.now() > end) throw new Error("استغرق التحليل وقتاً أطول من المتوقع.");
      return sleep(wait)
        .then(function () { return fetch(via(st.toString())); })
        .then(function (r) { return r.text(); })
        .then(function (raw) {
          var t = raw.trim();
          if (t === "form-waiting" || t === "success") return readResult(w.toString());
          if (["canceled", "crashed", "error", "null"].indexOf(t) !== -1) {
            throw new Error("تعطّل التحليل داخل n8n (" + t + ").");
          }
          wait = Math.round(wait * 1.15);
          return tick();
        });
    }
    return Promise.resolve().then(tick);
  }

  // إن لم يكن الاسم معروفاً، اطلبه هنا داخل المحادثة بدل رفض التحليل بصمت
  function analyze(file, secs) {
    var name = nm.value.trim();
    if (!name) {
      askNameThen(function (n) {
        nm.value = n;
        try { localStorage.setItem("khatib_name", n); } catch (e) {}
        runAnalysis(file, secs, n);
      });
      return;
    }
    runAnalysis(file, secs, name);
  }

  function askNameThen(next) {
    extra.innerHTML = "";
    bot("استلمت التسجيل. باقي شي واحد: وش اسمك؟ (أحتاجه لأتابع تطوّرك بين الجلسات)");
    var p = el("div", "panel");
    var row = el("div", "bar");
    var i = el("input");
    i.type = "text"; i.placeholder = "اكتب اسمك هنا";
    i.style.cssText = "flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 13px;font-size:14px;font-family:var(--font);";
    var ok = el("button", "act"); ok.textContent = "ابدأ التحليل";
    row.appendChild(i); row.appendChild(ok);
    p.appendChild(row);
    extra.appendChild(p);
    i.focus();

    function go() {
      var v = i.value.trim();
      if (!v) { i.focus(); return; }
      extra.innerHTML = "";
      me(v);
      next(v);
    }
    ok.addEventListener("click", go);
    i.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); go(); } });
  }

  function runAnalysis(file, secs, name) {
    setBusy(true);
    bot("استلمت التسجيل. جاري التفريغ وحساب المقاييس ثم التقييم — قد يستغرق دقيقة. لا تغلق الصفحة.");
    var t = typing();

    var fd = new FormData();
    fd.append("field-0", name);
    fd.append("field-1", tp.value);
    fd.append("field-2", sb.value.trim());
    fd.append("field-3", file, file.name || "speech.webm");
    fd.append("field-4", "");
    fd.append("field-5", secs ? String(secs) : "");

    fetch("/api/submit?agent=main", { method: "POST", body: fd })
      .then(function (r) { return r.text(); })
      .then(function (raw) {
        var j = null;
        try { j = JSON.parse(raw); } catch (e) {}
        if (j && j.proxyError) throw new Error(j.proxyError);
        if (j && j.formWaitingUrl) return poll(j.formWaitingUrl);
        if (j && j.formSubmittedText) return j.formSubmittedText;
        return (raw || "").trim();
      })
      .then(function (rep) { t.remove(); renderReport(rep); })
      .catch(function (e) { t.remove(); bot("تعذّر إكمال التحليل: " + e.message, true); })
      .then(function () { setBusy(false); });
  }

  /* ---------- upload ---------- */

  var picker = document.createElement("input");
  picker.type = "file";
  picker.accept = ".mp3,.wav,.m4a,.aac,.ogg,.mp4,.mov,.webm,.m4v";
  picker.style.display = "none";
  document.body.appendChild(picker);

  upBtn.addEventListener("click", function () { if (!busy) picker.click(); });
  picker.addEventListener("change", function () {
    if (!picker.files || !picker.files[0]) return;
    var f = picker.files[0];
    me("⬆ " + f.name + " (" + (f.size / 1048576).toFixed(1) + " ميجا)");
    picker.value = "";
    setBusy(true);
    dur(f)
      .then(function (s) { return prepareForUpload(f, s); })
      .then(function (r) { setBusy(false); analyze(r.file, r.secs); })
      .catch(function () { setBusy(false); });
  });

  function dur(file) {
    return new Promise(function (res) {
      var v = document.createElement(/^video\//.test(file.type) ? "video" : "audio");
      var u = URL.createObjectURL(file), done = false;
      function fin(x) { if (done) return; done = true; URL.revokeObjectURL(u); res(Number.isFinite(x) && x > 0 ? Math.round(x) : null); }
      v.preload = "metadata";
      v.onloadedmetadata = function () { fin(v.duration); };
      v.onerror = function () { fin(null); };
      setTimeout(function () { fin(null); }, 6000);
      v.src = u;
    });
  }

  /* ---------- keep the upload under Vercel's 4.5 MB function limit ----------
     التحليل صوتي بالكامل، فنستخرج الصوت فقط ونحوّله إلى WAV أحادي 16 كيلوهرتز.
     هذا يقلّص الحجم عشرات المرات ويحافظ على الجودة التي يحتاجها التفريغ.        */

  var MAX_BYTES = 4 * 1024 * 1024;
  var TARGET_HZ = 16000;
  var MAX_SECONDS = 130; // 16kHz mono 16-bit ≈ 32 KB/s → يبقى تحت السقف

  function encodeWav(samples, rate) {
    var len = samples.length;
    var buf = new ArrayBuffer(44 + len * 2);
    var v = new DataView(buf);
    function str(off, s) { for (var i = 0; i < s.length; i++) v.setUint8(off + i, s.charCodeAt(i)); }
    str(0, "RIFF"); v.setUint32(4, 36 + len * 2, true); str(8, "WAVE"); str(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, len * 2, true);
    var o = 44;
    for (var i = 0; i < len; i++) {
      var x = Math.max(-1, Math.min(1, samples[i]));
      v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true);
      o += 2;
    }
    return new Blob([buf], { type: "audio/wav" });
  }

  function shrinkToAudio(file) {
    var AC = window.AudioContext || window.webkitAudioContext;
    var OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!AC || !OAC) return Promise.reject(new Error("متصفحك لا يدعم معالجة الصوت."));

    return file.arrayBuffer()
      .then(function (ab) {
        var ctx = new AC();
        return ctx.decodeAudioData(ab).then(function (d) {
          try { ctx.close(); } catch (e) {}
          return d;
        }, function (e) {
          try { ctx.close(); } catch (e2) {}
          throw new Error("تعذّر قراءة الصوت من هذا الملف.");
        });
      })
      .then(function (decoded) {
        var full = decoded.duration;
        var use = Math.min(full, MAX_SECONDS);
        var off = new OAC(1, Math.max(1, Math.ceil(use * TARGET_HZ)), TARGET_HZ);
        var src = off.createBufferSource();
        src.buffer = decoded;
        src.connect(off.destination);
        src.start(0);
        return off.startRendering().then(function (r) {
          return {
            blob: encodeWav(r.getChannelData(0), TARGET_HZ),
            duration: Math.round(full),
            trimmed: full > MAX_SECONDS
          };
        });
      });
  }

  // يرجّع ملفاً جاهزاً للرفع مهما كان حجم/نوع المصدر
  function prepareForUpload(file, knownSecs) {
    if (file.size <= MAX_BYTES && /^audio\//.test(file.type || "")) {
      return Promise.resolve({ file: file, secs: knownSecs, note: null });
    }
    var note = bot("جاري استخراج المسار الصوتي وضغطه قبل الإرسال…");
    return shrinkToAudio(file).then(function (r) {
      var msg = "تم الضغط: " + (r.blob.size / 1048576).toFixed(2) + " ميجا.";
      if (r.trimmed) msg += " التسجيل أطول من الحد، فحُلّل أول " + Math.floor(MAX_SECONDS / 60) + " دقيقة و" + (MAX_SECONDS % 60) + " ثانية منه.";
      note.textContent = msg;
      return {
        file: new File([r.blob], "speech.wav", { type: "audio/wav" }),
        secs: r.trimmed ? MAX_SECONDS : (knownSecs || r.duration),
        note: msg
      };
    }).catch(function (e) {
      note.textContent = "تعذّر ضغط الملف: " + e.message + " — جرّب رفع ملف صوتي أقصر.";
      note.parentNode.querySelector(".bub") && note.classList.add("bad");
      throw e;
    });
  }

  /* ---------- recording ---------- */

  function stopTracks() { if (rec.stream) rec.stream.getTracks().forEach(function (t) { t.stop(); }); rec.stream = null; }
  function mime(kind) {
    var L = kind === "video"
      ? ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]
      : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    for (var i = 0; i < L.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(L[i])) return L[i];
    return "";
  }
  function clk(s) { var m = Math.floor(s / 60), x = s % 60; return (m < 10 ? "0" : "") + m + ":" + (x < 10 ? "0" : "") + x; }

  micBtn.addEventListener("click", function () {
    if (busy) return;
    extra.innerHTML = "";
    var p = el("div", "panel");
    var q = el("div", "rowc");
    var bv = el("button", "btn pri"); bv.textContent = "🎥 فيديو";
    var ba = el("button", "btn"); ba.textContent = "🎤 صوت فقط";
    var bx = el("button", "btn"); bx.textContent = "إلغاء";
    q.appendChild(bv); q.appendChild(ba); q.appendChild(bx);
    p.appendChild(el("div", "rstat", "<span>وش تفضّل تسجّل؟ الفيديو يمكّن تقييم الحضور، والصوت أخف وأسرع.</span>"));
    p.appendChild(q);
    extra.appendChild(p);
    bx.addEventListener("click", function () { extra.innerHTML = ""; });
    bv.addEventListener("click", function () { startRec("video"); });
    ba.addEventListener("click", function () { startRec("audio"); });
  });

  function startRec(kind) {
    extra.innerHTML = "";
    var p = el("div", "panel");
    var cam = el("video", "cam" + (kind === "video" ? " on" : ""));
    cam.autoplay = true; cam.muted = true; cam.playsInline = true;
    var st = el("div", "rstat", '<span class="rd"></span><span>اضغط "ابدأ" وامنح إذن الكاميرا والمايك</span>');
    var row = el("div", "rowc");
    var go = el("button", "btn pri"); go.textContent = "ابدأ التسجيل";
    var bk = el("button", "btn"); bk.textContent = "رجوع";
    row.appendChild(go); row.appendChild(bk);
    p.appendChild(cam); p.appendChild(st); p.appendChild(row);
    extra.appendChild(p);

    bk.addEventListener("click", function () { stopTracks(); extra.innerHTML = ""; });

    go.addEventListener("click", function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        st.textContent = "متصفحك لا يدعم التسجيل المباشر. استخدم زر الرفع بدلاً منه.";
        return;
      }
      navigator.mediaDevices.getUserMedia(kind === "video" ? { video: true, audio: true } : { audio: true })
        .then(function (s) {
          rec.stream = s; rec.kind = kind;
          if (kind === "video") cam.srcObject = s;

          var mt = mime(kind);
          rec.recorder = mt ? new MediaRecorder(s, { mimeType: mt }) : new MediaRecorder(s);
          rec.chunks = [];
          rec.recorder.ondataavailable = function (e) { if (e.data && e.data.size) rec.chunks.push(e.data); };

          // مسجّل صوتي منفصل بمعدل بت منخفض — هذا وحده ما يُرسل للتحليل،
          // فيبقى الحجم أقل من ميجا مهما طال التسجيل، والفيديو يبقى للمعاينة فقط.
          rec.aChunks = [];
          rec.aRecorder = null;
          var aTracks = s.getAudioTracks();
          if (aTracks.length) {
            var aMime = mime("audio");
            try {
              rec.aRecorder = new MediaRecorder(new MediaStream(aTracks),
                aMime ? { mimeType: aMime, audioBitsPerSecond: 32000 } : { audioBitsPerSecond: 32000 });
              rec.aRecorder.ondataavailable = function (e) { if (e.data && e.data.size) rec.aChunks.push(e.data); };
            } catch (e) { rec.aRecorder = null; }
          }

          var pending = rec.aRecorder ? 2 : 1;
          function partDone() { if (--pending === 0) { stopTracks(); preview(kind); } }

          rec.recorder.onstop = function () {
            rec.blob = new Blob(rec.chunks, { type: mt || (kind === "video" ? "video/webm" : "audio/webm") });
            partDone();
          };
          if (rec.aRecorder) {
            rec.aRecorder.onstop = function () {
              rec.audioBlob = new Blob(rec.aChunks, { type: rec.aRecorder.mimeType || "audio/webm" });
              partDone();
            };
            rec.aRecorder.start();
          }
          rec.recorder.start();
          rec.secs = 0;
          st.innerHTML = '<span class="rd on"></span><span id="tm">00:00 — جارٍ التسجيل</span>';
          rec.timer = setInterval(function () {
            rec.secs++;
            var e = document.getElementById("tm");
            if (e) e.textContent = clk(rec.secs) + " — جارٍ التسجيل";
          }, 1000);
          var sp = el("button", "btn pri"); sp.textContent = "إيقاف";
          row.replaceChild(sp, go);
          sp.addEventListener("click", function () {
            clearInterval(rec.timer);
            if (rec.aRecorder && rec.aRecorder.state !== "inactive") rec.aRecorder.stop();
            if (rec.recorder.state !== "inactive") rec.recorder.stop();
          });
        })
        .catch(function (err) {
          st.textContent = "تعذّر الوصول للكاميرا أو المايك: " + err.message + " — تأكد من السماح بالإذن، أو استخدم زر الرفع.";
        });
    });
  }

  function preview(kind) {
    extra.innerHTML = "";
    var p = el("div", "panel");
    var pl = el(kind === "video" ? "video" : "audio", "prev");
    pl.controls = true;
    pl.src = URL.createObjectURL(rec.blob);
    p.appendChild(pl);
    var row = el("div", "rowc");
    var again = el("button", "btn"); again.textContent = "إعادة التسجيل";
    var use = el("button", "btn pri"); use.textContent = "حلّل هذا التسجيل";
    row.appendChild(again); row.appendChild(use);
    p.appendChild(row);
    extra.appendChild(p);

    again.addEventListener("click", function () { rec.blob = null; rec.audioBlob = null; startRec(kind); });
    use.addEventListener("click", function () {
      // نرسل المسار الصوتي المضغوط فقط — الفيديو ثقيل ولا يستخدمه التحليل
      var send = rec.audioBlob && rec.audioBlob.size ? rec.audioBlob : rec.blob;
      var ext = (send.type || "").indexOf("mp4") !== -1 ? "mp4" : "webm";
      var f = new File([send], "speech." + ext, { type: send.type || "audio/webm" });
      me("🎬 تسجيل (" + clk(rec.secs) + " · " + (f.size / 1048576).toFixed(2) + " ميجا)");
      extra.innerHTML = "";

      if (f.size > MAX_BYTES) {
        setBusy(true);
        prepareForUpload(f, rec.secs)
          .then(function (r) { setBusy(false); analyze(r.file, r.secs); })
          .catch(function () { setBusy(false); });
      } else {
        analyze(f, rec.secs);
      }
    });
  }

  greet();
  input.focus();
})();
</script>
