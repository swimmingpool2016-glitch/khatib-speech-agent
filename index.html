<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>خطيب — منصة تحليل الخطابة</title>
<style>
  :root {
    --stage-950: #14100a;
    --stage-900: #1b150e;
    --stage-850: #221b13;
    --stage-800: #2a2117;
    --stage-750: #352a1d;
    --stage-700: #4a3c2c;
    --accent: #e8a33d;
    --accent-soft: #f0b75c;
    --good: #4fb6a8;
    --warn: #e0654f;
    --ink-100: #f5ecda;
    --ink-300: #cdbfa4;
    --ink-500: #9c8b70;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
    --font: "Segoe UI", Tahoma, "Dubai", "Noto Naskh Arabic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--stage-950);
    background-image:
      radial-gradient(ellipse 55% 40% at 50% 0%, rgba(232,163,61,.09), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 100%, rgba(0,0,0,.5), transparent 60%);
    color: var(--ink-100);
    font-family: var(--font);
    display: grid;
    grid-template-columns: 1fr 272px;
    height: 100vh;
    overflow: hidden;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- sidebar ---------- */
  .sidebar {
    background: linear-gradient(180deg, var(--stage-850), var(--stage-900));
    border-left: 1px solid var(--stage-700);
    display: flex; flex-direction: column; padding: 20px 16px; gap: 20px; min-height: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark {
    width: 32px; height: 32px; border-radius: 9px; flex: none;
    background: linear-gradient(150deg, var(--accent-soft), var(--accent) 65%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 10px rgba(232,163,61,.32);
  }
  .brand-mark svg { width: 18px; height: 18px; }
  .brand-name { font-size: 16px; font-weight: 700; }
  .brand-sub { font-size: 10.5px; color: var(--ink-500); }
  .roster-label { font-size: 10.5px; font-weight: 600; color: var(--ink-500); letter-spacing: 1px; padding-inline: 4px; margin-bottom: 8px; }
  .roster { display: flex; flex-direction: column; gap: 6px; }
  .agent-btn {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px;
    padding: 10px 11px; border-radius: var(--r-md); border: 1px solid transparent; color: var(--ink-300);
  }
  .agent-btn:hover { background: rgba(232,163,61,.07); }
  .agent-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .agent-btn.active { background: rgba(232,163,61,.13); border-color: rgba(232,163,61,.32); color: var(--ink-100); }
  .agent-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--stage-800); display:flex; align-items:center; justify-content:center; color: var(--accent-soft); flex: none; }
  .agent-btn.active .agent-icon { background: var(--accent); color: var(--stage-950); }
  .agent-icon svg { width: 15px; height: 15px; }
  .agent-title { font-size: 13px; font-weight: 600; display: block; }
  .agent-desc { font-size: 10.5px; color: var(--ink-500); }
  .side-note {
    margin-top: auto; padding: 11px; border-radius: var(--r-md);
    background: var(--stage-800); border: 1px solid var(--stage-700);
    font-size: 11px; color: var(--ink-500); line-height: 1.65;
  }
  .side-note b { color: var(--ink-300); }

  /* ---------- stage ---------- */
  .stage { display: flex; flex-direction: column; min-width: 0; padding: 18px 24px 20px; }
  .stage-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; gap: 12px; }
  .stage-head h1 { font-size: 18px; margin: 0; font-weight: 700; }
  .ghost-btn {
    all: unset; cursor: pointer; font-size: 11.5px; color: var(--ink-500);
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--stage-700); white-space: nowrap;
  }
  .ghost-btn:hover { color: var(--ink-100); border-color: var(--accent); }
  .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 4px 4px 16px; }
  .msg { display: flex; gap: 10px; max-width: 82%; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.wide { max-width: 100%; align-self: stretch; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; flex: none; display:flex; align-items:center; justify-content:center; }
  .msg.bot .avatar { background: var(--accent); color: var(--stage-950); }
  .msg.user .avatar { background: var(--stage-800); color: var(--good); border: 1px solid var(--stage-700); }
  .avatar svg { width: 15px; height: 15px; }
  .bubble {
    padding: 11px 14px; border-radius: var(--r-md); font-size: 13.5px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word; min-width: 0;
  }
  .msg.bot .bubble { background: var(--stage-800); border: 1px solid var(--stage-700); border-top-right-radius: 4px; }
  .msg.user .bubble { background: rgba(232,163,61,.15); border: 1px solid rgba(232,163,61,.28); border-top-left-radius: 4px; }
  .bubble.err { background: rgba(224,101,79,.13); border-color: rgba(224,101,79,.34); }

  .dots { display: inline-flex; gap: 4px; align-items: center; }
  .dots span { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-500); animation: blink 1.2s infinite ease-in-out; }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .dots span, .rec-dot.live { animation: none; } }

  /* ---------- report ---------- */
  .report { flex: 1; background: transparent; padding: 0; white-space: normal; }
  .rp-hero {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    background: linear-gradient(140deg, var(--stage-800), var(--stage-850));
    border: 1px solid var(--stage-700); border-radius: var(--r-lg);
    padding: 18px 20px; margin-bottom: 14px;
  }
  .rp-score { display: flex; align-items: baseline; gap: 6px; }
  .rp-score .num { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
  .rp-score .den { font-size: 15px; color: var(--ink-500); }
  .rp-hero-meta { display: flex; flex-direction: column; gap: 7px; min-width: 0; flex: 1; }
  .rp-headline { font-size: 14px; line-height: 1.65; color: var(--ink-100); }
  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; padding: 4px 10px; border-radius: 999px;
    background: var(--stage-750); border: 1px solid var(--stage-700); color: var(--ink-300);
  }
  .chip.good { color: var(--good); border-color: rgba(79,182,168,.4); }
  .chip.warn { color: var(--warn); border-color: rgba(224,101,79,.4); }

  .rp-card {
    background: var(--stage-850); border: 1px solid var(--stage-700);
    border-radius: var(--r-lg); padding: 16px 18px; margin-bottom: 12px;
  }
  .rp-card h3 {
    margin: 0 0 12px; font-size: 12px; font-weight: 700; letter-spacing: .6px;
    color: var(--ink-500); text-transform: none;
  }
  .rp-body { font-size: 13.5px; line-height: 1.85; color: var(--ink-300); white-space: pre-wrap; }

  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 108px 1fr 34px; align-items: center; gap: 12px; }
  .bar-label { font-size: 12.5px; color: var(--ink-300); }
  .bar-track { height: 8px; background: var(--stage-750); border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-val { font-size: 12.5px; text-align: left; color: var(--ink-100); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }
  .tile {
    background: var(--stage-800); border: 1px solid var(--stage-700);
    border-radius: var(--r-md); padding: 12px 13px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .tile .k { font-size: 10.5px; color: var(--ink-500); }
  .tile .v { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .tile .n { font-size: 10.5px; color: var(--ink-500); line-height: 1.5; }

  /* ---------- composer ---------- */
  .composer { border-top: 1px solid var(--stage-700); padding-top: 13px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    all: unset; cursor: pointer; padding: 9px 16px; border-radius: 999px;
    background: var(--stage-800); border: 1px solid var(--stage-700); color: var(--ink-100); font-size: 13px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn.primary { background: var(--accent); color: var(--stage-950); border-color: var(--accent); font-weight: 700; }
  .btn.primary:hover { background: var(--accent-soft); }
  .row input[type="text"] {
    flex: 1; min-width: 160px; background: var(--stage-800); border: 1px solid var(--stage-700); color: var(--ink-100);
    border-radius: var(--r-md); padding: 11px 13px; font-size: 13.5px; font-family: var(--font);
  }
  .row input:focus { outline: none; border-color: var(--accent); }

  .panel {
    background: var(--stage-800); border: 1px solid var(--stage-700); border-radius: var(--r-lg); padding: 15px;
    display: flex; flex-direction: column; gap: 11px;
  }
  .cam { width: 100%; max-width: 320px; border-radius: var(--r-md); background: #000; display: none; align-self: center; }
  .cam.show { display: block; }
  .rec-status { display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 12.5px; color: var(--ink-300); text-align: center; line-height: 1.6; }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); flex: none; }
  .rec-dot.live { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .prev { width: 100%; max-width: 320px; align-self: center; border-radius: var(--r-md); }
  .drop {
    border: 1.5px dashed var(--stage-700); border-radius: var(--r-md); padding: 20px; text-align: center;
    font-size: 12.5px; color: var(--ink-500); cursor: pointer;
  }
  .drop:hover { border-color: var(--accent); color: var(--ink-300); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--stage-700); border-radius: 8px; }

  @media (max-width: 780px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .sidebar { flex-direction: row; align-items: center; border-left: none; border-bottom: 1px solid var(--stage-700); overflow-x: auto; padding: 12px 14px; }
    .roster { flex-direction: row; }
    .agent-desc, .side-note, .roster-label, .brand-sub { display: none; }
    .msg { max-width: 94%; }
    .stage { padding: 14px; }
    .bar-row { grid-template-columns: 92px 1fr 30px; }
    .rp-score .num { font-size: 42px; }
  }
</style>
</head>
<body>

  <main class="stage">
    <div class="stage-head">
      <h1 id="heading">محرك تحليل الخطابة</h1>
      <button class="ghost-btn" id="resetBtn">جلسة جديدة</button>
    </div>
    <div class="log" id="log"></div>
    <div class="composer" id="composer"></div>
  </main>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#14100a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">خطيب</div>
        <div class="brand-sub">تقييم الخطابة بالذكاء الاصطناعي</div>
      </div>
    </div>

    <div>
      <div class="roster-label">الوكلاء</div>
      <div class="roster">
        <button class="agent-btn active" data-agent="main">
          <span class="agent-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span>
          <span><span class="agent-title">محرك تحليل الخطابة</span><span class="agent-desc">تقرير بدرجات ومقاييس</span></span>
        </button>
        <button class="agent-btn" data-agent="topic">
          <span class="agent-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M12 2l3 3M12 2 9 5"/><circle cx="12" cy="15" r="6"/><path d="M12 12v3l2 2"/></svg></span>
          <span><span class="agent-title">مولّد الموضوع الارتجالي</span><span class="agent-desc">عبارة ارتجالية فورية</span></span>
        </button>
      </div>
    </div>

    <div class="side-note">
      <b>خصوصية:</b> التسجيل يُرسل للتحليل ولا يُحفظ في أي مكان. يُخزَّن التقرير فقط لقياس تطوّرك عبر الجلسات.
    </div>
  </aside>

<script>
(function () {
  "use strict";

  var log = document.getElementById("log");
  var composer = document.getElementById("composer");
  var heading = document.getElementById("heading");
  var resetBtn = document.getElementById("resetBtn");
  var rosterBtns = document.querySelectorAll(".agent-btn");

  var agent = "main";
  var A = {};
  var rec = { stream: null, recorder: null, chunks: [], blob: null, kind: null, timer: null, seconds: 0 };

  var BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v4M9 22h6"/></svg>';
  var USR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>';

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  function toBottom() { log.scrollTop = log.scrollHeight; }
  function clearComposer() { composer.innerHTML = ""; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function botText(text, cls) {
    var m = el("div", "msg bot");
    m.appendChild(el("div", "avatar", BOT));
    var b = el("div", "bubble" + (cls ? " " + cls : ""));
    b.textContent = text;
    m.appendChild(b);
    log.appendChild(m); toBottom();
    return b;
  }
  function botTyping() {
    var m = el("div", "msg bot");
    m.appendChild(el("div", "avatar", BOT));
    m.appendChild(el("div", "bubble", '<span class="dots"><span></span><span></span><span></span></span>'));
    log.appendChild(m); toBottom();
    return m;
  }
  function userText(text) {
    var m = el("div", "msg user");
    m.appendChild(el("div", "avatar", USR));
    var b = el("div", "bubble");
    b.textContent = text;
    m.appendChild(b);
    log.appendChild(m); toBottom();
  }

  /* ================= report rendering ================= */

  var DIMS = [
    { key: "الوضوح", label: "وضوح الرسالة" },
    { key: "البنية", label: "تماسك البنية" },
    { key: "الجذب", label: "جذب الجمهور" },
    { key: "اللغة", label: "سلامة اللغة" },
    { key: "الإيقاع", label: "الإيقاع الصوتي" },
    { key: "الثقة", label: "الثقة والحضور" }
  ];

  function parseReport(text) {
    var out = { scores: {}, overall: null, delta: null, headline: "", sections: [] };

    DIMS.forEach(function (d) {
      var m = text.match(new RegExp(d.key + "\\s+(\\d{1,3})"));
      if (m) out.scores[d.key] = Number(m[1]);
    });
    var mo = text.match(/الإجمالي\s+(\d{1,3})/);
    if (mo) out.overall = Number(mo[1]);

    var md = text.match(/الدرجة الإجمالية:\s*\d+\/100\s*\(([▲▼])\s*([+\-]?\d+)/);
    if (md) out.delta = { dir: md[1], val: Number(md[2]) };

    var body = text.replace(/^📊[^\n]*\n?/, "").trim();
    var firstMarker = body.indexOf("【");
    var head = firstMarker >= 0 ? body.slice(0, firstMarker) : body;
    out.headline = head.trim();

    if (firstMarker >= 0) {
      var rest = body.slice(firstMarker);
      var re = /【\s*([^】]+?)\s*】\s*\n?/g;
      var parts = [], mm, last = null;
      while ((mm = re.exec(rest)) !== null) {
        if (last) last.end = mm.index;
        last = { title: mm[1].trim(), start: re.lastIndex, end: rest.length };
        parts.push(last);
      }
      parts.forEach(function (p) {
        out.sections.push({ title: p.title, content: rest.slice(p.start, p.end).trim() });
      });
    }
    return out;
  }

  function scoreBand(n) {
    if (n >= 80) return { cls: "good", label: "متقدّم" };
    if (n >= 65) return { cls: "", label: "جيد" };
    if (n >= 50) return { cls: "", label: "يحتاج صقلاً" };
    return { cls: "warn", label: "يحتاج تدريباً مركزاً" };
  }

  function metricTiles(content) {
    var tiles = [];
    var w = content.match(/عدد الكلمات:\s*(\d+)/);
    var uq = content.match(/كلمات فريدة:\s*(\d+)\s*\(ثراء\s*([\d.]+)%/);
    var wpm = content.match(/سرعة الكلام:\s*(\d+)\s*كلمة\/دقيقة\s*-\s*([^\n]+)/);
    var wpmNa = content.match(/سرعة الكلام:\s*(غير متاحة)/);
    var fl = content.match(/التلكؤات:\s*(\d+)\s*مرة\s*\(([\d.]+)\s*لكل 100 كلمة\)\s*-\s*([^\n]+)/);

    if (w) tiles.push({ k: "عدد الكلمات", v: w[1], n: "" });
    if (uq) tiles.push({ k: "ثراء المفردات", v: uq[2] + "%", n: uq[1] + " كلمة فريدة" });
    if (wpm) tiles.push({ k: "سرعة الكلام", v: wpm[1], n: wpm[2].trim() });
    else if (wpmNa) tiles.push({ k: "سرعة الكلام", v: "—", n: "مدة التسجيل غير معروفة" });
    if (fl) tiles.push({ k: "التلكؤات", v: fl[1], n: fl[2] + " لكل 100 كلمة · " + fl[3].trim() });

    if (!tiles.length) return null;

    var wrap = el("div", "tiles");
    tiles.forEach(function (t) {
      var c = el("div", "tile");
      c.appendChild(el("div", "k")).textContent = t.k;
      c.appendChild(el("div", "v")).textContent = t.v;
      if (t.n) c.appendChild(el("div", "n")).textContent = t.n;
      wrap.appendChild(c);
    });
    return wrap;
  }

  function renderReport(text) {
    var r = parseReport(text);
    var m = el("div", "msg bot wide");
    m.appendChild(el("div", "avatar", BOT));
    var box = el("div", "report");
    m.appendChild(box);

    if (r.overall != null) {
      var hero = el("div", "rp-hero");
      var sc = el("div", "rp-score");
      var num = el("div", "num"); num.textContent = String(r.overall);
      var den = el("div", "den"); den.textContent = "/100";
      sc.appendChild(num); sc.appendChild(den);
      hero.appendChild(sc);

      var meta = el("div", "rp-hero-meta");
      if (r.headline) {
        var h = el("div", "rp-headline"); h.textContent = r.headline; meta.appendChild(h);
      }
      var chips = el("div", "chips");
      var band = scoreBand(r.overall);
      var c1 = el("span", "chip " + band.cls); c1.textContent = band.label;
      chips.appendChild(c1);
      if (r.delta) {
        var up = r.delta.dir === "▲";
        var c2 = el("span", "chip " + (up ? "good" : "warn"));
        c2.textContent = (up ? "▲ +" : "▼ ") + Math.abs(r.delta.val) + " عن الجلسة السابقة";
        chips.appendChild(c2);
      } else {
        var c3 = el("span", "chip"); c3.textContent = "جلستك الأولى — خط الأساس";
        chips.appendChild(c3);
      }
      meta.appendChild(chips);
      hero.appendChild(meta);
      box.appendChild(hero);
    }

    if (Object.keys(r.scores).length) {
      var card = el("div", "rp-card");
      card.appendChild(el("h3")).textContent = "الدرجات التفصيلية";
      var bars = el("div", "bars");
      DIMS.forEach(function (d) {
        var v = r.scores[d.key];
        if (v == null) return;
        var row = el("div", "bar-row");
        var lab = el("div", "bar-label"); lab.textContent = d.label;
        var track = el("div", "bar-track");
        var fill = el("div", "bar-fill");
        fill.style.width = Math.max(2, Math.min(100, v)) + "%";
        track.appendChild(fill);
        var val = el("div", "bar-val"); val.textContent = String(v);
        row.appendChild(lab); row.appendChild(track); row.appendChild(val);
        bars.appendChild(row);
      });
      card.appendChild(bars);
      box.appendChild(card);
    }

    r.sections.forEach(function (s) {
      if (s.title.indexOf("الدرجات") === 0) return;
      var card = el("div", "rp-card");
      card.appendChild(el("h3")).textContent = s.title;
      if (s.title.indexOf("مقاييس") === 0) {
        var tiles = metricTiles(s.content);
        if (tiles) { card.appendChild(tiles); box.appendChild(card); return; }
      }
      var b = el("div", "rp-body"); b.textContent = s.content;
      card.appendChild(b);
      box.appendChild(card);
    });

    if (!r.sections.length && r.overall == null) {
      var plain = el("div", "rp-card");
      var pb = el("div", "rp-body"); pb.textContent = text;
      plain.appendChild(pb);
      box.appendChild(plain);
    }

    log.appendChild(m); toBottom();
  }

  /* ================= submission ================= */

  function submit(which, fields) {
    var fd = new FormData();
    fields.forEach(function (f) {
      if (f.file) fd.append(f.name, f.file, f.file.name || "recording.webm");
      else fd.append(f.name, f.value == null ? "" : String(f.value));
    });

    return fetch("/api/submit?agent=" + encodeURIComponent(which), { method: "POST", body: fd })
      .then(function (res) { return res.text(); })
      .then(function (text) {
        var json = null;
        try { json = JSON.parse(text); } catch (e) {}
        if (json && json.proxyError) throw new Error(json.proxyError);
        if (json && json.formSubmittedText) return json.formSubmittedText;
        if (json && json.formWaitingUrl) return poll(json.formWaitingUrl);
        if (json && json.redirectURL) return "تم الإرسال. النتيجة: " + json.redirectURL;
        return (text || "").trim() || "تم إرسال الطلب.";
      });
  }

  function via(url) { return "/api/status?url=" + encodeURIComponent(url); }

  function poll(waitingUrl) {
    var w = new URL(waitingUrl);
    var sig = w.searchParams.get("signature");
    var st = new URL(w.href);
    st.pathname = st.pathname.replace(/\/$/, "") + "/n8n-execution-status";
    if (sig) st.searchParams.set("signature", sig);

    var wait = 1500;
    var deadline = Date.now() + 6 * 60 * 1000;

    function tick() {
      if (Date.now() > deadline) throw new Error("استغرق التحليل وقتاً أطول من المتوقع. راجع سجل التنفيذ في n8n.");
      return sleep(wait)
        .then(function () { return fetch(via(st.toString())); })
        .then(function (r) { return r.text(); })
        .then(function (raw) {
          var t = raw.trim();
          if (t === "success") {
            return fetch(via(w.toString()))
              .then(function (r) { return r.text(); })
              .then(function (html) {
                var doc = new DOMParser().parseFromString(html, "text/html");
                var c = doc.getElementById("submitted-content");
                var h = doc.getElementById("submitted-header");
                var body = c ? c.textContent.trim() : "";
                if (body) return body;
                return h ? h.textContent.trim() : "اكتمل التحليل.";
              });
          }
          if (["canceled", "crashed", "error", "null"].indexOf(t) !== -1) {
            throw new Error("تعطّل تنفيذ التحليل (" + t + "). راجع سجل التنفيذ في n8n للتفاصيل.");
          }
          wait = Math.round(wait * 1.15);
          return tick();
        });
    }
    return Promise.resolve().then(tick);
  }

  /* ================= media ================= */

  function stopTracks() {
    if (rec.stream) rec.stream.getTracks().forEach(function (t) { t.stop(); });
    rec.stream = null;
  }
  function pickMime(kind) {
    var list = kind === "video"
      ? ["video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm", "video/mp4"]
      : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
    for (var i = 0; i < list.length; i++) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(list[i])) return list[i];
    }
    return "";
  }
  function clock(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function fileDuration(file) {
    return new Promise(function (resolve) {
      var isVid = /^video\//.test(file.type);
      var m = document.createElement(isVid ? "video" : "audio");
      var url = URL.createObjectURL(file);
      var done = false;
      var finish = function (v) {
        if (done) return; done = true;
        URL.revokeObjectURL(url);
        resolve(Number.isFinite(v) && v > 0 ? Math.round(v) : null);
      };
      m.preload = "metadata";
      m.onloadedmetadata = function () { finish(m.duration); };
      m.onerror = function () { finish(null); };
      setTimeout(function () { finish(null); }, 6000);
      m.src = url;
    });
  }

  /* ================= main flow ================= */

  function startMain() {
    A = {}; log.innerHTML = ""; clearComposer();
    botText("أهلاً بك في خطيب. راح نمشي خطوة خطوة، وبنهاية الجلسة بتحصل على تقرير بدرجات ومقاييس دقيقة وخطة تدريب أسبوعية.\n\nبدايةً، وش اسمك؟");
    askName();
  }

  function askName() {
    clearComposer();
    var row = el("div", "row");
    var inp = el("input"); inp.type = "text"; inp.placeholder = "اكتب اسمك";
    var b = el("button", "btn primary"); b.textContent = "التالي";
    row.appendChild(inp); row.appendChild(b);
    composer.appendChild(row); inp.focus();
    function go() {
      var v = inp.value.trim(); if (!v) return;
      userText(v); A.name = v; clearComposer();
      botText("تشرّفنا يا " + v + ". وش نوع خطابك؟");
      askType();
    }
    b.addEventListener("click", go);
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
  }

  function askType() {
    clearComposer();
    var row = el("div", "row");
    ["ارتجالي", "معد", "مفتوح"].forEach(function (o) {
      var b = el("button", "btn"); b.textContent = o;
      b.addEventListener("click", function () {
        userText(o); A.type = o; clearComposer();
        botText("تمام. عندك موضوع محدد؟ اكتبه أو تجاوز.");
        askTopic();
      });
      row.appendChild(b);
    });
    composer.appendChild(row);
  }

  function askTopic() {
    clearComposer();
    var row = el("div", "row");
    var inp = el("input"); inp.type = "text"; inp.placeholder = "موضوع الخطاب (اختياري)";
    var skip = el("button", "btn"); skip.textContent = "تجاوز";
    var next = el("button", "btn primary"); next.textContent = "التالي";
    row.appendChild(inp); row.appendChild(skip); row.appendChild(next);
    composer.appendChild(row); inp.focus();
    function go(v) {
      A.topic = v; userText(v || "(بدون موضوع محدد)"); clearComposer();
      botText("جاهز تسجّل الحين مباشرة، أو تفضّل ترفع ملف جاهز؟");
      askSource();
    }
    skip.addEventListener("click", function () { go(""); });
    next.addEventListener("click", function () { go(inp.value.trim()); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") go(inp.value.trim()); });
  }

  function askSource() {
    clearComposer();
    var row = el("div", "row");
    var v = el("button", "btn primary"); v.textContent = "🎥 سجّل فيديو الآن";
    var a = el("button", "btn"); a.textContent = "🎤 سجّل صوت فقط";
    var u = el("button", "btn"); u.textContent = "📁 ارفع ملف جاهز";
    row.appendChild(v); row.appendChild(a); row.appendChild(u);
    composer.appendChild(row);
    v.addEventListener("click", function () { userText("سجّل فيديو الآن"); startRec("video"); });
    a.addEventListener("click", function () { userText("سجّل صوت فقط"); startRec("audio"); });
    u.addEventListener("click", function () { userText("ارفع ملف جاهز"); showUpload(); });
  }

  function showUpload() {
    clearComposer();
    var drop = el("div", "drop");
    drop.textContent = "اضغط لاختيار ملف صوتي أو مرئي";
    var inp = el("input"); inp.type = "file";
    inp.accept = ".mp3,.wav,.m4a,.aac,.ogg,.mp4,.mov,.webm,.m4v";
    inp.style.display = "none";
    drop.appendChild(inp);
    composer.appendChild(drop);
    drop.addEventListener("click", function () { inp.click(); });
    inp.addEventListener("change", function () {
      if (!inp.files || !inp.files[0]) return;
      var f = inp.files[0];
      A.file = f;
      userText("📁 " + f.name);
      clearComposer();
      var wait = botText("جاري قراءة الملف...");
      fileDuration(f).then(function (d) {
        A.duration = d;
        wait.textContent = d
          ? "استلمت الملف (المدة " + clock(d) + "). أي ملاحظات إضافية؟ اكتبها أو تجاوز."
          : "استلمت الملف. أي ملاحظات إضافية؟ اكتبها أو تجاوز.";
        askNotes();
      });
    });
  }

  function startRec(kind) {
    clearComposer();
    var panel = el("div", "panel");
    var cam = el("video", "cam" + (kind === "video" ? " show" : ""));
    cam.autoplay = true; cam.muted = true; cam.playsInline = true;
    var status = el("div", "rec-status", '<span class="rec-dot"></span><span>اضغط "ابدأ التسجيل" وامنح إذن الكاميرا والمايك</span>');
    var ctrls = el("div", "row"); ctrls.style.justifyContent = "center";
    var start = el("button", "btn primary"); start.textContent = "ابدأ التسجيل";
    var back = el("button", "btn"); back.textContent = "رجوع";
    ctrls.appendChild(start); ctrls.appendChild(back);
    panel.appendChild(cam); panel.appendChild(status); panel.appendChild(ctrls);
    composer.appendChild(panel);

    back.addEventListener("click", function () { stopTracks(); askSource(); });

    start.addEventListener("click", function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        status.textContent = "متصفحك ما يدعم التسجيل المباشر. استخدم خيار رفع ملف جاهز.";
        return;
      }
      navigator.mediaDevices.getUserMedia(kind === "video" ? { video: true, audio: true } : { audio: true })
        .then(function (stream) {
          rec.stream = stream; rec.kind = kind;
          if (kind === "video") cam.srcObject = stream;

          var mime = pickMime(kind);
          rec.recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
          rec.chunks = [];
          rec.recorder.ondataavailable = function (e) { if (e.data && e.data.size > 0) rec.chunks.push(e.data); };
          rec.recorder.onstop = function () {
            rec.blob = new Blob(rec.chunks, { type: mime || (kind === "video" ? "video/webm" : "audio/webm") });
            stopTracks();
            showPreview(kind);
          };
          rec.recorder.start();
          rec.seconds = 0;
          status.innerHTML = '<span class="rec-dot live"></span><span id="tmr">00:00 — جارٍ التسجيل</span>';
          rec.timer = setInterval(function () {
            rec.seconds++;
            var t = document.getElementById("tmr");
            if (t) t.textContent = clock(rec.seconds) + " — جارٍ التسجيل";
          }, 1000);

          var stop = el("button", "btn primary"); stop.textContent = "إيقاف التسجيل";
          ctrls.replaceChild(stop, start);
          stop.addEventListener("click", function () {
            clearInterval(rec.timer);
            if (rec.recorder.state !== "inactive") rec.recorder.stop();
          });
        })
        .catch(function (err) {
          status.textContent = "تعذّر الوصول للكاميرا أو المايك: " + err.message + ". تأكد من السماح بالإذن، أو استخدم رفع ملف جاهز.";
        });
    });
  }

  function showPreview(kind) {
    clearComposer();
    var panel = el("div", "panel");
    var p = el(kind === "video" ? "video" : "audio", "prev");
    p.controls = true;
    p.src = URL.createObjectURL(rec.blob);
    panel.appendChild(p);
    var row = el("div", "row"); row.style.justifyContent = "center";
    var retry = el("button", "btn"); retry.textContent = "إعادة التسجيل";
    var use = el("button", "btn primary"); use.textContent = "استخدام هذا التسجيل";
    row.appendChild(retry); row.appendChild(use);
    panel.appendChild(row);
    composer.appendChild(panel);

    retry.addEventListener("click", function () { rec.blob = null; startRec(kind); });
    use.addEventListener("click", function () {
      var ext = (rec.blob.type || "").indexOf("mp4") !== -1 ? "mp4" : "webm";
      A.file = new File([rec.blob], "recording." + ext, { type: rec.blob.type });
      A.duration = rec.seconds > 0 ? rec.seconds : null;
      userText("🎬 تسجيل جاهز (" + clock(rec.seconds) + ")");
      clearComposer();
      botText("ممتاز. أي ملاحظات إضافية تبي المدرّب ياخذها بعين الاعتبار؟ اكتبها أو تجاوز.");
      askNotes();
    });
  }

  function askNotes() {
    clearComposer();
    var row = el("div", "row");
    var inp = el("input"); inp.type = "text"; inp.placeholder = "ملاحظات إضافية (اختياري)";
    var skip = el("button", "btn"); skip.textContent = "تجاوز";
    var go = el("button", "btn primary"); go.textContent = "إرسال للتحليل";
    row.appendChild(inp); row.appendChild(skip); row.appendChild(go);
    composer.appendChild(row); inp.focus();
    function run(v) {
      A.notes = v; userText(v || "(لا يوجد)"); clearComposer(); runMain();
    }
    skip.addEventListener("click", function () { run(""); });
    go.addEventListener("click", function () { run(inp.value.trim()); });
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") run(inp.value.trim()); });
  }

  function runMain() {
    botText("جاري تفريغ الصوت، حساب المقاييس، ثم التقييم المنهجي وبناء خطة التدريب. قد يستغرق دقيقة أو أكثر — لا تغلق الصفحة.");
    var typing = botTyping();

    submit("main", [
      { name: "field-0", value: A.name },
      { name: "field-1", value: A.type },
      { name: "field-2", value: A.topic },
      { name: "field-3", file: A.file },
      { name: "field-4", value: A.notes },
      { name: "field-5", value: A.duration || "" }
    ]).then(function (msg) {
      typing.remove();
      renderReport(msg);
      clearComposer();
      var again = el("button", "btn primary"); again.textContent = "تحليل خطاب جديد";
      again.addEventListener("click", startMain);
      composer.appendChild(again);
    }).catch(function (err) {
      typing.remove();
      botText("تعذّر إكمال التحليل: " + err.message, "err");
      clearComposer();
      var again = el("button", "btn"); again.textContent = "حاول مرة ثانية";
      again.addEventListener("click", startMain);
      composer.appendChild(again);
    });
  }

  /* ================= topic flow ================= */

  function startTopic() {
    A = {}; log.innerHTML = ""; clearComposer();
    botText("تبي عبارة ارتجالية تتحدث عنها؟ اختر تصنيفاً:");
    askCategory();
  }

  function askCategory() {
    clearComposer();
    var row = el("div", "row");
    ["عام", "اجتماعي", "مهني ووظيفي", "تحفيزي", "تحدٍّ مفاجئ"].forEach(function (o) {
      var b = el("button", "btn"); b.textContent = o;
      b.addEventListener("click", function () { userText(o); clearComposer(); runTopic(o); });
      row.appendChild(b);
    });
    composer.appendChild(row);
  }

  function runTopic(cat) {
    var typing = botTyping();
    submit("topic", [{ name: "field-0", value: cat }]).then(function (msg) {
      typing.remove();
      botText(msg);
      clearComposer();
      var again = el("button", "btn primary"); again.textContent = "موضوع ثاني";
      again.addEventListener("click", startTopic);
      composer.appendChild(again);
    }).catch(function (err) {
      typing.remove();
      botText("تعذّر توليد الموضوع: " + err.message, "err");
      clearComposer();
      var again = el("button", "btn"); again.textContent = "حاول مرة ثانية";
      again.addEventListener("click", startTopic);
      composer.appendChild(again);
    });
  }

  /* ================= switching ================= */

  function switchAgent(next) {
    stopTracks();
    agent = next;
    rosterBtns.forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-agent") === next); });
    if (next === "main") { heading.textContent = "محرك تحليل الخطابة"; startMain(); }
    else { heading.textContent = "مولّد الموضوع الارتجالي"; startTopic(); }
  }

  rosterBtns.forEach(function (b) {
    b.addEventListener("click", function () { switchAgent(b.getAttribute("data-agent")); });
  });
  resetBtn.addEventListener("click", function () { switchAgent(agent); });

  switchAgent("main");
})();
</script>
